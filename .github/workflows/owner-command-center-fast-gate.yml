name: Owner Command Center Fast Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "owner-command-center/**"
      - "studio/**"
      - "courses/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/owner-command-center-fast-gate.yml"
  pull_request:
    branches: [main]
    paths:
      - "owner-command-center/**"
      - "studio/**"
      - "courses/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/owner-command-center-fast-gate.yml"

permissions:
  contents: read

concurrency:
  group: owner-command-center-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/obserra_academy_studio?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            owner-command-center/package-lock.json
      - name: Install Studio dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Command Center dependencies
        working-directory: owner-command-center
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate complete Command Center syntax
        working-directory: owner-command-center
        run: node scripts/verify-syntax.mjs
      - name: Run Command Center governance and packaging verification
        working-directory: owner-command-center
        run: npm run verify
      - name: Run complete Studio and Command Center resilience suite
        run: npm run verify:2000x
