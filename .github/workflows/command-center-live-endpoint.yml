name: Command Center Live Endpoint Gate
run-name: Command Center endpoint contract • ${{ github.ref_name }} • ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      build_target_bound_media:
        description: Build optional target-bound Windows automation media
        required: false
        default: false
        type: boolean
      target_hostname:
        description: Windows hostname for optional target-bound media
        required: false
        default: obserra
        type: string
  push:
    branches:
      - agent/command-center-live-endpoint
    paths:
      - "owner-command-center/electron/endpoint-enrollment.cjs"
      - "owner-command-center/electron/academy-production-evidence.cjs"
      - "owner-command-center/electron/academy-release-approval.cjs"
      - "owner-command-center/electron/academy-github-evidence.cjs"
      - "owner-command-center/electron/main-with-remediation.cjs"
      - "owner-command-center/electron/preload.cjs"
      - "owner-command-center/src/academy-batch.js"
      - "owner-command-center/src/academy-github-evidence.js"
      - "owner-command-center/scripts/verify-endpoint-enrollment.mjs"
      - "owner-command-center/scripts/verify-academy-production-evidence.mjs"
      - "owner-command-center/scripts/verify-academy-release-approval.mjs"
      - "owner-command-center/scripts/verify-academy-github-evidence.mjs"
      - ".github/workflows/command-center-live-endpoint.yml"
  pull_request:
    branches:
      - main
      - agent/academy-production-integration
    paths:
      - "owner-command-center/electron/endpoint-enrollment.cjs"
      - "owner-command-center/electron/academy-production-evidence.cjs"
      - "owner-command-center/electron/academy-release-approval.cjs"
      - "owner-command-center/electron/academy-github-evidence.cjs"
      - "owner-command-center/electron/main-with-remediation.cjs"
      - "owner-command-center/electron/preload.cjs"
      - "owner-command-center/src/academy-batch.js"
      - "owner-command-center/src/academy-github-evidence.js"
      - "owner-command-center/scripts/verify-endpoint-enrollment.mjs"
      - "owner-command-center/scripts/verify-academy-production-evidence.mjs"
      - "owner-command-center/scripts/verify-academy-release-approval.mjs"
      - "owner-command-center/scripts/verify-academy-github-evidence.mjs"
      - ".github/workflows/command-center-live-endpoint.yml"

permissions:
  contents: read

concurrency:
  group: command-center-live-endpoint-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_PROGRESS: "false"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"

jobs:
  endpoint-contract:
    name: Endpoint identity, evidence, approval, and local-only contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: owner-command-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-command-center-endpoint-${{ hashFiles('owner-command-center/package.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-command-center-endpoint-
      - name: Install Command Center dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false --prefer-offline
      - name: Validate changed JavaScript and CommonJS syntax
        run: |
          node --check electron/main-with-remediation.cjs
          node --check electron/endpoint-enrollment.cjs
          node --check electron/academy-production-evidence.cjs
          node --check electron/academy-release-approval.cjs
          node --check electron/academy-github-evidence.cjs
          node --check electron/preload.cjs
          node --check src/academy-batch.js
          node --check src/academy-github-evidence.js
          node --check scripts/verify-endpoint-enrollment.mjs
          node --check scripts/verify-academy-production-evidence.mjs
          node --check scripts/verify-academy-release-approval.mjs
          node --check scripts/verify-academy-github-evidence.mjs
      - name: Run complete Command Center verification once
        run: npm run verify
      - name: Verify no endpoint credentials are embedded and allocation is current
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=node_modules --exclude='*.md' '(sk_live_[A-Za-z0-9]{16,}|whsec_[A-Za-z0-9]{16,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' .; then
            echo "Embedded production credential material detected."
            exit 1
          fi
          grep -F 'localOnly: true' electron/endpoint-enrollment.cjs
          grep -F '127.0.0.1' electron/endpoint-enrollment.cjs
          grep -F 'publicationLocked: true' electron/academy-production-evidence.cjs
          grep -F 'configuredCourseWorkers !== 16' electron/academy-production-evidence.cjs
          grep -F 'configuredApplicationWorkers !== 20' electron/academy-production-evidence.cjs
          grep -F 'publicationAuthorized: false' electron/academy-release-approval.cjs
          grep -F 'checkoutAuthorized: false' electron/academy-release-approval.cjs
          grep -F 'hmac-sha256-device-bound' electron/academy-release-approval.cjs
          grep -F 'DECISION_MARKER' electron/academy-github-evidence.cjs
          grep -F 'MAX_ARTIFACT_BYTES' electron/academy-github-evidence.cjs
          grep -F 'crc32(content)' electron/academy-github-evidence.cjs

  windows-release:
    name: Optional target-bound Windows automation media
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_target_bound_media }}
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        working-directory: owner-command-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore npm and Electron caches
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/npm-cache
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-${{ runner.arch }}-command-center-media-${{ hashFiles('owner-command-center/package.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-command-center-media-
      - name: Install Command Center dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false --prefer-offline
      - name: Build target-bound release media
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ./scripts/build-removable-media-package.ps1 -TargetHostname "${{ inputs.target_hostname }}"
      - name: Verify release-media contract
        shell: pwsh
        run: |
          $media = Get-ChildItem (Join-Path $PWD "release-media") -Directory -ErrorAction SilentlyContinue | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (-not $media) { $media = Get-Item (Join-Path $PWD "release-media") }
          $required = @(
            "SHA256SUMS.json",
            "SHA256SUMS.txt",
            "Obserra-Command-Center-Bootstrap.json",
            "Install-Obserra-Command-Center.ps1",
            "Test-Obserra-Command-Center-Endpoint.ps1",
            "ENDPOINT-OPERATIONS.md",
            "INSTALL-AND-RECOVERY.md",
            "HIGH-AVAILABILITY.md"
          )
          foreach ($name in $required) {
            if (-not (Test-Path (Join-Path $media.FullName $name))) { throw "required artifact missing: $name" }
          }
          $bootstrap = Get-Content (Join-Path $media.FullName "Obserra-Command-Center-Bootstrap.json") -Raw | ConvertFrom-Json
          if ($bootstrap.schemaVersion -ne "1.0") { throw "bootstrap schema mismatch" }
          if ($bootstrap.targetHostname -ne "${{ inputs.target_hostname }}".ToLowerInvariant()) { throw "target hostname mismatch" }
          if ($bootstrap.localOnly -ne $true) { throw "local-only boundary missing" }
          if ($bootstrap.requireEnrollment -ne $true) { throw "endpoint enrollment requirement missing" }
          if ($bootstrap.autoEnroll -ne $true) { throw "target-bound auto enrollment missing" }
          if ($bootstrap.autoStart -ne $true) { throw "auto-start requirement missing" }
          if ($bootstrap.expectedCourseWorkerTarget -ne 16) { throw "16-course-worker allocation missing" }
          if ($bootstrap.expectedApplicationWorkerAllocation -ne 20) { throw "20-application-worker allocation missing" }
          if ($bootstrap.expectedTotalWorkerAllocation -ne 36) { throw "36-total-worker allocation missing" }
          if ($bootstrap.requiredWorkerMode -ne "segmented-production-workforce") { throw "worker mode mismatch" }
          if ($bootstrap.publicationAuthorityGranted -ne $false) { throw "bootstrap must not grant publication authority" }
          if (@($bootstrap.connectors).Count -ne 10) { throw "connector inventory mismatch" }

          $manifest = @(Get-Content (Join-Path $media.FullName "SHA256SUMS.json") -Raw | ConvertFrom-Json)
          if ($manifest.Count -lt 8) { throw "hash manifest incomplete" }
          foreach ($entry in $manifest) {
            $path = Join-Path $media.FullName $entry.File
            if (-not (Test-Path $path)) { throw "manifest file missing: $($entry.File)" }
            if ((Get-FileHash -Algorithm SHA256 -Path $path).Hash -ne $entry.SHA256) { throw "hash mismatch for $($entry.File)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Obserra-Command-Center-Target-Bound-Media-${{ github.sha }}
          path: owner-command-center/release-media/**
          if-no-files-found: error
          retention-days: 180

  claim-boundary:
    name: Endpoint contract claim boundary
    if: ${{ always() && needs.endpoint-contract.result == 'success' && (needs.windows-release.result == 'success' || needs.windows-release.result == 'skipped') }}
    runs-on: ubuntu-24.04
    needs:
      - endpoint-contract
      - windows-release
    steps:
      - run: |
          echo "Endpoint source contract: PASSED"
          echo "Device-bound owner approval contract: PASSED"
          echo "Standard cross-platform installers: governed by the separate Standard Desktop Installers workflow"
          echo "Optional target-bound media: ${{ needs.windows-release.result }}"
          echo "Actual installation and live heartbeat: requires execution on the selected owner device"
          echo "Course publication authority: NOT GRANTED"
