name: Owner Command Center Fast Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "owner-command-center/**"
      - "studio/**"
      - "courses/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/owner-command-center-fast-gate.yml"
  pull_request:
    branches: [main]
    paths:
      - "owner-command-center/**"
      - "studio/**"
      - "courses/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/owner-command-center-fast-gate.yml"

permissions:
  contents: read

concurrency:
  group: owner-command-center-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    if: github.event_name != 'pull_request' || github.head_ref != 'agent/academy-61-course-completion-only'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Studio dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Command Center dependencies
        working-directory: owner-command-center
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Validate complete Command Center syntax
        working-directory: owner-command-center
        run: |
          node --check electron/main.cjs
          node --check electron/main-with-remediation.cjs
          node --check electron/preload.cjs
          node --check electron/connectors.cjs
          node --check electron/academy-studio.cjs
          node --check electron/academy-preview.cjs
          node --check electron/owner-ai.cjs
          node --check electron/discovery.cjs
          node --check electron/threat-policy.cjs
          node --check electron/vulnerability-scan.cjs
          node --check electron/security-enforcement.cjs
          node --check electron/trend-store.cjs
          node --check electron/ai-remediation.cjs
          node --check electron/remediation-queue.cjs
          node --check src/app.js
          node --check src/security-dashboard.js
          node --check src/remediation-dashboard.js
      - name: Verify 15-second visible refresh contract
        working-directory: owner-command-center
        run: node -e "const fs=require('fs');const source=fs.readFileSync('src/app.js','utf8');if(!/REFRESH_INTERVAL_MS\s*=\s*15000\s*;/.test(source))throw new Error('Command Center refresh interval must be exactly 15 seconds');console.log('15-second refresh contract verified');"
      - name: Run Command Center governance and packaging verification
        working-directory: owner-command-center
        run: npm run verify
      - name: Run complete Studio and Command Center resilience suite
        env:
          DATABASE_URL: postgresql://schema_validation:schema_validation@127.0.0.1:5432/schema_validation?schema=public
        run: npm run verify:2000x
