name: PR57 Commerce Contract Align Once

on:
  push:
    branches:
      - fix/live-commerce-contract-alignment-20260820

permissions:
  contents: write

concurrency:
  group: pr57-commerce-contract-align-once
  cancel-in-progress: false

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout controlled branch
        uses: actions/checkout@v4
        with:
          ref: fix/live-commerce-contract-alignment-20260820
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm install --no-audit --no-fund

      - name: Apply deterministic workflow contract alignment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          POSTMERGE = Path('.github/workflows/postmerge-production-evidence.yml')
          FIFTY = Path('.github/workflows/enterprise-50x-production-gate.yml')
          CONTRACT = Path('.github/workflows/production-contract-release-gate.yml')
          MEGA = Path('.github/workflows/enterprise-mega-release-gate.yml')
          files = [POSTMERGE, FIFTY, CONTRACT, MEGA]

          def replace_exact(path, old, new, expected=1):
              text = path.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences of {old!r}, found {count}')
              path.write_text(text.replace(old, new))

          def replace_step(path, name, replacement):
              text = path.read_text()
              pattern = re.compile(
                  rf'(?ms)^      - name: {re.escape(name)}\n.*?(?=^      - name: |^  [A-Za-z0-9_-]+:\n|\Z)'
              )
              updated, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'{path}: expected one step named {name!r}, found {count}')
              path.write_text(updated)

          catalog_old = "          grep -Eqi '/api/academy/checkout\\?course=' /tmp/academy.html\n"
          catalog_new = (
              "          grep -Eqi 'action=\"/api/academy/checkout\"' /tmp/academy.html\n"
              "          grep -Eqi 'method=\"post\"' /tmp/academy.html\n"
          )
          for path in [POSTMERGE, FIFTY, CONTRACT]:
              replace_exact(path, catalog_old, catalog_new)

          replace_step(POSTMERGE, 'Validate sanitized commerce contract', '''      - uses: actions/checkout@v4
      - name: Validate sanitized commerce contract
        run: node studio/verify-live-academy-commerce-contract.mjs --health
''')
          replace_step(POSTMERGE, 'Validate multiple live checkout sessions without 5xx responses', '''      - name: Validate current POST checkout and licensing-pending boundary
        run: node studio/verify-live-academy-commerce-contract.mjs --checkout
''')
          replace_step(POSTMERGE, 'Validate webhook signature enforcement and invalid-course containment', '''      - name: Validate signed webhook boundary
        run: node studio/verify-live-academy-commerce-contract.mjs --webhook
''')

          replace_exact(
              FIFTY,
              '          curl --fail --silent --show-error --max-time 30 -D /tmp/api-headers.txt https://www.obserrallc.com/api/academy/commerce-health -o /tmp/health.json\n',
              '          curl --silent --show-error --max-time 30 -D /tmp/api-headers.txt https://www.obserrallc.com/api/academy/commerce-health -o /tmp/health.json\n',
          )
          replace_step(FIFTY, 'Validate commerce contract', '''      - uses: actions/checkout@v4
      - name: Validate commerce contract
        run: node studio/verify-live-academy-commerce-contract.mjs --health
''')
          replace_step(FIFTY, 'Validate governed checkout paths', '''      - name: Validate governed POST checkout paths
        run: node studio/verify-live-academy-commerce-contract.mjs --checkout
''')
          replace_step(FIFTY, 'Validate webhook and invalid input containment', '''      - name: Validate webhook boundary and checkout method containment
        run: node studio/verify-live-academy-commerce-contract.mjs --webhook --checkout
''')

          replace_step(CONTRACT, 'Validate sanitized commerce health contract', '''      - uses: actions/checkout@v4
      - name: Validate sanitized commerce health contract
        run: node studio/verify-live-academy-commerce-contract.mjs --health
''')
          replace_step(CONTRACT, 'Validate multiple governed course checkout paths', '''      - uses: actions/checkout@v4
      - name: Validate governed POST checkout paths
        run: node studio/verify-live-academy-commerce-contract.mjs --checkout
''')
          replace_step(CONTRACT, 'Validate invalid course containment', '')

          replace_step(MEGA, 'Validate Academy catalog and highly available Stripe checkout', '''      - name: Validate Academy catalog and current commerce contract
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 30 https://www.obserrallc.com/academy -o /tmp/academy.html
          grep -Eqi 'Obserra Academy' /tmp/academy.html
          grep -Eqi '60[^0-9]+(paid )?courses|numberOfItems[^0-9]+60' /tmp/academy.html
          grep -Eqi 'not a state license|not.*third.party professional certification|not for certification' /tmp/academy.html
          grep -Eqi 'action="/api/academy/checkout"' /tmp/academy.html
          grep -Eqi 'method="post"' /tmp/academy.html
          node studio/verify-live-academy-commerce-contract.mjs --health --checkout
''')
          replace_step(MEGA, 'Validate signed webhook boundary and failure containment', '''      - name: Validate signed webhook and checkout method boundaries
        run: node studio/verify-live-academy-commerce-contract.mjs --webhook --checkout
''')

          for path in files:
              text = path.read_text()
              if 'stripe-checkout-session-id' in text:
                  raise SystemExit(f'{path}: retired stripe-checkout-session-id assertion remains')
              if '/api/academy/checkout?course=' in text:
                  raise SystemExit(f'{path}: retired GET checkout contract remains')
              if 'studio/verify-live-academy-commerce-contract.mjs' not in text:
                  raise SystemExit(f'{path}: shared verifier invocation missing')
          PY

      - name: Remove one-shot helper before verification
        run: rm .github/workflows/pr57-commerce-contract-align-once.yml

      - name: Verify aligned contract and Studio tests
        run: |
          set -euo pipefail
          node --check studio/verify-live-academy-commerce-contract.mjs
          npm run test

      - name: Commit aligned workflows and verifier
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows studio/verify-live-academy-commerce-contract.mjs tests/live-commerce-workflow-contract.test.ts
          git commit -m "fix(prod): align Academy live commerce evidence contract"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:fix/live-commerce-contract-alignment-20260820
