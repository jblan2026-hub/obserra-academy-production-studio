name: Academy 61 Course Content Checkpoint
run-name: 61-course protected content • ${{ github.ref_name }} • ${{ github.sha }}

on:
  pull_request:
    branches:
      - main
    paths:
      - "courses/**"
      - "sources/**"
      - "studio/**"
      - "package.json"
      - ".github/workflows/academy-61-content-checkpoint.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: academy-61-content-checkpoint
  cancel-in-progress: false

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_PROGRESS: "false"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
  OBSERRA_PORTFOLIO_WORKER_COUNT: "36"
  OBSERRA_APPLICATION_WORKER_COUNT: "0"
  ACADEMY_COURSE_WORKER_COUNT: "36"
  ACADEMY_WORKER_MODE: interchangeable-course-production
  ACADEMY_EXPECTED_SURGE_COURSES: "61"
  ACADEMY_EXPECTED_REVIEW_COURSES: "61"
  ACADEMY_SURGE_EXCLUDED_COURSE_IDS: __none__
  ACADEMY_MINIMUM_LESSON_WORDS: "1200"
  ACADEMY_MINIMUM_EXACT_SOURCES_PER_COURSE: "2"
  ACADEMY_PROVIDER_PREFERENCE: anthropic,openai
  ACADEMY_PAID_RESEARCH_CONCURRENCY: "4"
  ACADEMY_PAID_AUTHORING_CONCURRENCY: "4"
  ACADEMY_PAID_REVIEW_CONCURRENCY: "2"
  ACADEMY_AUTHORING_MAX_ATTEMPTS: "2"
  ACADEMY_RESEARCH_MAX_ATTEMPTS: "1"
  ACADEMY_REVIEW_MAX_ATTEMPTS: "1"
  ACADEMY_AUTHORING_PROCESS_TIMEOUT_MS: "2700000"
  ACADEMY_AUTHORING_REQUEST_TIMEOUT_MS: "1800000"
  ACADEMY_AUTHORING_CHECKPOINTS_REQUIRED: "true"
  OPENAI_AUTHORING_MODEL: gpt-5
  OPENAI_RESEARCH_MODEL: gpt-5
  OPENAI_REVIEW_MODEL: gpt-5
  OPENAI_RESEARCH_REASONING_EFFORT: medium
  OPENAI_REVIEW_REASONING_EFFORT: high
  OPENAI_RESEARCH_MAX_OUTPUT_TOKENS: "20000"
  OPENAI_REVIEW_MAX_OUTPUT_TOKENS: "16000"
  ANTHROPIC_AUTHORING_MODEL: claude-sonnet-4-5
  ANTHROPIC_RESEARCH_MODEL: claude-sonnet-4-5
  ANTHROPIC_REVIEW_MODEL: claude-sonnet-4-5
  ANTHROPIC_RESEARCH_MAX_TOKENS: "20000"
  ANTHROPIC_REVIEW_MAX_TOKENS: "16000"
  STUDIO_OWNER_ORGANIZATION_ID: org_obserra_academy
  ACADEMY_CHECKPOINT_GATEWAY_URL: https://nwxnyqlyzyufgoadtqxs.supabase.co/functions/v1/academy-checkpoint-gateway

jobs:
  checkpoint-all-course-content:
    name: Free-first research, author, review, and checkpoint all 61 courses
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_ORGANIZATION: ${{ secrets.OPENAI_ORGANIZATION }}
      OPENAI_PROJECT: ${{ secrets.OPENAI_PROJECT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout course production source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify all 36 logical workers are assigned only to Academy
        run: node studio/verify-academy-61-worker-contract.mjs

      - name: Preflight protected OIDC checkpoint gateway
        run: node --input-type=module -e "import('./studio/academy-hollywood-checkpoints.mjs').then(async m => { const r = await m.bootstrapHollywoodCheckpointTable(); if (!r.bootstrapped) process.exit(2); console.log('[Academy Studio] Protected checkpoint gateway ready:', r.transport); })"

      - name: Apply governed course policy
        run: npm run apply:course-policy

      - name: Restore matching protected course checkpoints before any paid work
        run: node studio/restore-academy-hollywood-checkpoints.mjs

      - name: Reject restored packages with stale source context
        run: node studio/prune-stale-restored-course-packages.mjs

      - name: Build deterministic no-model source context from local authoritative registry
        run: node studio/build-free-course-source-context.mjs

      - name: Validate all currently reusable packages without model credits
        run: node studio/validate-academy-hollywood-surge.mjs || true

      - name: Build credit-last work plan
        run: node studio/plan-academy-credit-last.mjs

      - name: Resolve a funded production provider only if paid work remains
        if: env.ACADEMY_PAID_MODEL_REQUIRED == 'true'
        run: node studio/resolve-academy-production-provider.mjs

      - name: Research only courses that still lack current passing evidence
        if: env.ACADEMY_PAID_MODEL_REQUIRED == 'true'
        run: node studio/research-all-61-courses.mjs

      - name: Merge researched primary sources into governed runtime registry
        if: env.ACADEMY_PAID_MODEL_REQUIRED == 'true'
        run: node studio/merge-61-course-research-registry.mjs

      - name: Author and checkpoint only courses without reusable packages
        if: env.ACADEMY_PAID_MODEL_REQUIRED == 'true'
        run: node studio/author-all-61-cinematic-parallel.mjs

      - name: Materialize learner, instructor, assessment, accessibility, rights, and certificate assets
        run: node studio/materialize-hollywood-course-assets.mjs

      - name: Validate all 61 structural packages and exact source mappings
        run: node studio/validate-academy-hollywood-surge.mjs

      - name: Rebuild gap plan after deterministic validation
        run: node studio/plan-academy-credit-last.mjs

      - name: Independently review only courses without reusable 90-plus evidence
        if: env.ACADEMY_PAID_MODEL_REQUIRED == 'true'
        run: node studio/review-all-61-courses.mjs

      - name: Confirm protected checkpoint count
        run: node studio/verify-protected-61-checkpoint-count.mjs
