name: Obserra Enterprise Mega Release Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/owner-ai-command-center-production
    paths:
      - "app/**"
      - "courses/**"
      - "lib/**"
      - "prisma/**"
      - "studio/**"
      - "owner-command-center/**"
      - "package.json"
      - ".github/workflows/enterprise-mega-release-gate.yml"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: obserra-enterprise-mega-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio-production:
    name: Studio production, tests, database, and catalog
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://obserra_ci:obserra_ci@127.0.0.1:5432/obserra_ci
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_ci_only_not_a_real_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test
      - run: npm run validate
      - run: npm run catalog
      - run: npm run db:validate
      - run: npm run build

  course-governance:
    name: Course branding, tags, disclaimers, and credential policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate governed course content
        shell: bash
        run: |
          set -euo pipefail
          test -d courses
          grep -RIlE 'OBSERRA|Obserra' courses studio | head -n 1
          grep -RIlE 'tag|category|topic' courses studio | head -n 1
          grep -RIlE 'informational|information only|not for certification|not certification' courses studio | head -n 1
          grep -RIlE 'completion|credential|certificate of completion' courses studio | head -n 1
          if grep -RInE 'guaranteed certification|guaranteed compliance|certifies compliance' courses studio; then exit 1; fi

  api-security:
    name: API, authentication, tenant isolation, and secret policy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate API and security contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -RIlE 'authorization|authentication|Clerk|session' app lib package.json | head -n 1
          grep -RIlE 'organization|tenant' app lib prisma | head -n 1
          grep -RIlE 'audit|correlation|immutable' app lib prisma | head -n 1
          if find . -path './.git' -prune -o -path './node_modules' -prune -o -type f \( -name '*.pem' -o -name '*.pfx' -o -name '*.key' \) -print | grep -q .; then exit 1; fi
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules '(sk_live_[A-Za-z0-9]{16,}|whsec_[A-Za-z0-9]{16,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' .; then exit 1; fi

  website-production:
    name: Website, commerce, Academy synchronization, and production health
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate integration contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -RIlE 'catalog|course' .github app courses studio | head -n 1
          grep -RIlE 'website|sync|publication' .github app studio | head -n 1
          grep -RIlE 'disclaimer|informational|completion' courses studio app | head -n 1
      - name: Validate production domains and security headers from real GET responses
        shell: bash
        run: |
          set -euo pipefail
          for url in https://www.obserrallc.com https://obserrallc.com; do
            code=$(curl --location --silent --show-error --max-time 30 -D /tmp/headers.txt -o /tmp/site.html -w '%{http_code}' "$url")
            test "$code" = "200"
            test -s /tmp/site.html
            grep -Eqi 'Obserra' /tmp/site.html
            grep -Eqi '^strict-transport-security:' /tmp/headers.txt
            grep -Eqi '^content-security-policy:' /tmp/headers.txt
            grep -Eqi '^x-content-type-options:' /tmp/headers.txt
            grep -Eqi '^x-frame-options:' /tmp/headers.txt
          done
      - name: Validate Academy catalog and protected checkout end to end
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 30 https://www.obserrallc.com/academy -o /tmp/academy.html
          grep -Eqi 'Obserra Academy' /tmp/academy.html
          grep -Eqi '60[^0-9]+(paid )?courses|numberOfItems[^0-9]+60' /tmp/academy.html
          grep -Eqi 'not a state license|not.*third.party professional certification|not for certification' /tmp/academy.html
          grep -Eqi '/api/academy/checkout\?course=' /tmp/academy.html
          code=$(curl --silent --show-error --max-time 30 -D /tmp/checkout-headers.txt -o /tmp/checkout.html -w '%{http_code}' 'https://www.obserrallc.com/api/academy/checkout?course=zero-trust-strategy')
          if [ "$code" -ge 500 ]; then cat /tmp/checkout.html >&2; exit 1; fi
          test "$code" = "302" -o "$code" = "303" -o "$code" = "307" -o "$code" = "308"
          location=$(grep -i '^location:' /tmp/checkout-headers.txt | tail -n 1 | tr -d '\r')
          echo "$location" | grep -Eqi '/sign-in|identity=configuration-required|enrollment=identity-unavailable'
          if echo "$location" | grep -Eqi 'checkout\.stripe\.com|buy\.stripe\.com'; then exit 1; fi

  command-security:
    name: Command Center local-only and owner-control security
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        working-directory: owner-command-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run verify
      - name: Validate source and governed catalog
        shell: pwsh
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check electron/connectors.cjs
          node --check src/app.js
          $catalog = Get-Content policy/connector-catalog.json -Raw | ConvertFrom-Json
          if (-not $catalog.resources -or @($catalog.resources).Count -lt 3) { throw 'Resource catalog incomplete' }
          if ($catalog.defaultControlMode -notmatch 'read') { throw 'Catalog must default to read-only' }
          foreach ($resource in @($catalog.resources)) {
            if (-not $resource.writeCapabilitiesRequireOwnerApproval) { throw "Owner approval missing for $($resource.id)" }
          }

  command-release:
    name: Windows installer, portable package, removable media, and integrity
    runs-on: windows-2025
    timeout-minutes: 65
    defaults:
      run:
        working-directory: owner-command-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run package:media
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify executable inventory and SHA-256 manifests
        shell: pwsh
        run: |
          function Get-Sha256Hex {
            param([Parameter(Mandatory = $true)][string]$Path)
            $stream = [System.IO.File]::OpenRead($Path)
            try {
              $sha = [System.Security.Cryptography.SHA256]::Create()
              try { return ([BitConverter]::ToString($sha.ComputeHash($stream))).Replace('-','') }
              finally { $sha.Dispose() }
            } finally { $stream.Dispose() }
          }
          $media = Join-Path $PWD 'release-media'
          $required = @('SHA256SUMS.txt','SHA256SUMS.json','Install-Obserra-Command-Center.ps1','INSTALL-AND-RECOVERY.md','HIGH-AVAILABILITY.md')
          foreach ($file in $required) { if (-not (Test-Path (Join-Path $media $file))) { throw "Missing $file" } }
          $installer = Get-ChildItem $media -Filter 'Obserra-Owner-AI-Command-Center-*.exe' | Where-Object { $_.Name -notlike '*Portable*' }
          $portable = Get-ChildItem $media -Filter 'Obserra-Owner-AI-Command-Center-Portable-*.exe'
          if (-not $installer -or -not $portable) { throw 'Executable inventory incomplete' }
          $manifest = @(Get-Content (Join-Path $media 'SHA256SUMS.json') -Raw | ConvertFrom-Json)
          if ($manifest.Count -lt 5) { throw 'Hash manifest incomplete' }
          foreach ($entry in $manifest) {
            $path = Join-Path $media $entry.File
            if ((Get-Sha256Hex -Path $path) -ne $entry.SHA256) { throw "Hash mismatch for $($entry.File)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: command-center-enterprise-release-${{ github.sha }}
          path: owner-command-center/release-media/**
          if-no-files-found: error
          retention-days: 180

  resilience-evidence:
    name: High availability, recovery, rollback, and audit evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate resilience assets
        shell: bash
        run: |
          set -euo pipefail
          test -s owner-command-center/HIGH-AVAILABILITY.md
          test -s owner-command-center/INSTALL-AND-RECOVERY.md
          grep -Eqi 'standby|failover|backup|recovery' owner-command-center/HIGH-AVAILABILITY.md
          grep -Eqi 'install|restore|rollback|removable' owner-command-center/INSTALL-AND-RECOVERY.md
      - name: Build audit evidence
        shell: bash
        run: |
          mkdir -p release-evidence
          printf '{"commit":"%s","repository":"%s","workflow":"%s","runId":"%s","actor":"%s"}\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_WORKFLOW" "$GITHUB_RUN_ID" "$GITHUB_ACTOR" > release-evidence/manifest.json
          sha256sum release-evidence/manifest.json > release-evidence/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: enterprise-release-evidence-${{ github.sha }}
          path: release-evidence/**
          if-no-files-found: error
          retention-days: 365

  promotion:
    name: Final enterprise promotion readiness
    runs-on: ubuntu-latest
    needs:
      - studio-production
      - course-governance
      - api-security
      - website-production
      - command-security
      - command-release
      - resilience-evidence
    steps:
      - run: |
          echo 'Academy LCMS and Production Studio: PASSED'
          echo 'Course governance and publication controls: PASSED'
          echo 'Website public availability and protected commerce boundary: PASSED'
          echo 'Owner Command Center security and Windows release: PASSED'
          echo 'Recovery, high availability, integrity, and audit evidence: PASSED'
          echo 'Production identity readiness remains governed by the independent 10x identity gate.'
