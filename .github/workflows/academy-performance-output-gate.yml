name: Academy Performance Output Gate
run-name: Academy performance output • ${{ github.ref_name }} • ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - agent/academy-accelerated-performance-v2
    paths:
      - "studio/academy-authoring-performance.mjs"
      - "studio/author-courses-parallel.mjs"
      - "tests/academy-authoring-performance.test.ts"
      - "docs/operations/ACADEMY-PERFORMANCE-OUTPUT-OPTIMIZATION.md"
      - ".github/workflows/academy-performance-output-gate.yml"
  pull_request:
    branches:
      - agent/academy-build-acceleration
    paths:
      - "studio/academy-authoring-performance.mjs"
      - "studio/author-courses-parallel.mjs"
      - "tests/academy-authoring-performance.test.ts"
      - "docs/operations/ACADEMY-PERFORMANCE-OUTPUT-OPTIMIZATION.md"
      - ".github/workflows/academy-performance-output-gate.yml"

permissions:
  contents: read

concurrency:
  group: academy-performance-output-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://validation:validation@127.0.0.1:5432/academy_performance_validation?schema=public
  OBSERRA_PORTFOLIO_WORKER_COUNT: 36
  OBSERRA_APPLICATION_WORKER_COUNT: 20
  ACADEMY_COURSE_WORKER_COUNT: 16
  ACADEMY_AUTHORING_CONCURRENCY: 16
  ACADEMY_EXPECTED_REVIEW_COURSES: 61

jobs:
  performance-contract:
    name: Scheduling, retry, throughput, and output evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install repository dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate optimized coordinator syntax
        run: |
          node --check studio/academy-authoring-performance.mjs
          node --check studio/author-courses-parallel.mjs

      - name: Run performance contract tests
        run: node --test tests/academy-authoring-performance.test.ts

      - name: Run repository regression tests
        run: npm test

      - name: Validate Prisma contract without production credentials
        run: |
          npm run db:generate
          npm run db:validate

      - name: Verify current governed worker allocation
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'const portfolioWorkerCount = 36' studio/author-courses-parallel.mjs
          grep -F 'const applicationWorkerAllocation = 20' studio/author-courses-parallel.mjs
          grep -F 'const courseWorkerAllocation = 16' studio/author-courses-parallel.mjs
          grep -F 'schedulingPolicy: "longest-estimated-work-first"' studio/author-courses-parallel.mjs
          grep -F 'bounded deterministic jitter' studio/author-courses-parallel.mjs
          grep -F 'buildAuthoringPerformanceMetrics' studio/author-courses-parallel.mjs
          grep -F 'provider_request_invalid' studio/authoring-provider-errors.mjs
          if grep -A 16 'function shouldHaltPortfolio' studio/author-courses-parallel.mjs | grep -F 'provider_request_invalid'; then
            echo "A course-specific invalid request must not halt unrelated course workers."
            exit 1
          fi
          grep -F 'No missing, stale, or untraceable owner-review course packages require AI authoring.' studio/author-courses-parallel.mjs
          grep -F 'They do not establish independent source verification' studio/author-courses-parallel.mjs

      - name: Generate synthetic performance evidence
        run: |
          mkdir -p reports
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { buildAuthoringPerformanceMetrics, retryDelayMs } from './studio/academy-authoring-performance.mjs';
          const results = Array.from({ length: 16 }, (_, index) => ({
            ok: true,
            attempt: index % 7 === 0 ? 2 : 1,
            elapsedMs: 900000 + (index * 10000),
            outputBytes: 250000 + (index * 1000),
          }));
          const evidence = {
            schemaVersion: '2.0',
            generatedAt: new Date().toISOString(),
            fixtureOnly: true,
            allocation: {
              portfolioWorkers: 36,
              applicationWorkers: 20,
              academyWorkers: 16,
            },
            purpose: 'Verify performance math and evidence schema without invoking a provider or representing live throughput.',
            metrics: buildAuthoringPerformanceMetrics({
              results,
              elapsedMs: 3600000,
              launchedWorkerCount: 16,
              requestedCourses: 16,
            }),
            retryJitterSamplesMs: [1, 2, 3].map((attempt) => retryDelayMs(5000, attempt, 'fixture-course')),
            claimBoundary: 'Synthetic evidence validates calculations only. It is not a production course build result.',
          };
          fs.writeFileSync('reports/academy-performance-output-evidence.json', `${JSON.stringify(evidence, null, 2)}\n`);
          console.log(JSON.stringify(evidence.metrics, null, 2));
          NODE

      - name: Upload performance contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: academy-performance-output-${{ github.sha }}
          path: reports/academy-performance-output-evidence.json
          if-no-files-found: error
          retention-days: 90
