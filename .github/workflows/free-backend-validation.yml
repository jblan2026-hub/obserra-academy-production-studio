name: Validate Free-First Academy Backend

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/api/**"
      - "lib/**"
      - "studio/run-free-ai-worker.ts"
      - "studio/verify-free-backend.mjs"
      - "studio/verify-academy-zero-cost-pipeline.mjs"
      - "studio/local-ollama-responses-proxy.mjs"
      - "studio/render-all-61-local-media.mjs"
      - "prisma/**"
      - "package.json"
      - "tsconfig.backend.json"
      - "Dockerfile.backend"
      - "docker-compose.free-backend.yml"
      - ".dockerignore"
      - ".env.example"
      - ".github/workflows/academy-61-content-checkpoint.yml"
      - ".github/workflows/academy-61-course-completion-only.yml"
      - ".github/workflows/free-backend-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-free-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/academy?schema=public
      BACKEND_COST_MODE: free-first
      STUDIO_AUTH_PROVIDER: machine-only
      STUDIO_MACHINE_TOKEN: ci-only-free-backend-token
      STUDIO_OWNER_ORGANIZATION_ID: org_obserra_academy
      STUDIO_AUTH_DEFAULT_ORGANIZATION_ID: org_obserra_academy
      STUDIO_STORAGE_PROVIDER: local
      STUDIO_LOCAL_STORAGE_ROOT: .academy-private-storage-ci
      STUDIO_QUEUE_PROVIDER: postgres
      STUDIO_AI_PROVIDER: disabled
      STUDIO_ALLOW_PAID_AI: "false"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZHVtbXktZnJlZS1iYWNrZW5kLWJ1aWxk
      CLERK_SECRET_KEY: sk_test_ZHVtbXktZnJlZS1iYWNrZW5kLWJ1aWxk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies without paid services
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify free-first backend contract
        run: npm run verify:free-backend

      - name: Verify 61-course zero-cost pipeline contract
        run: node studio/verify-academy-zero-cost-pipeline.mjs

      - name: Generate Prisma Client explicitly
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Type-check backend surface
        run: npx tsc --noEmit -p tsconfig.backend.json

      - name: Build application without paid providers
        run: npm run build

      - name: Validate local Compose topology
        env:
          STUDIO_MACHINE_TOKEN: ci-only-free-backend-token
        run: docker compose -f docker-compose.free-backend.yml config --quiet
