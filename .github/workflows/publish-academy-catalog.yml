name: Publish Academy Catalog

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Website branch that receives the repository dispatch
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: academy-catalog-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://studio:studio@127.0.0.1:5432/studio?schema=public
    steps:
      - name: Checkout Studio
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate governed course packages
        run: npm run verify

      - name: Generate approved Academy catalog
        run: npm run catalog

      - name: Verify publishable catalog
        shell: bash
        run: |
          node <<'NODE'
          const catalog = require('./catalog/academy-course-catalog.json');
          if (catalog.schemaVersion !== '1.2') throw new Error('Catalog schemaVersion must equal 1.2');
          if (!Array.isArray(catalog.courses)) throw new Error('Catalog courses must be an array');
          for (const course of catalog.courses) {
            if (!['approved', 'published'].includes(course.releaseStatus)) throw new Error(`Course ${course.id} is not publishable`);
            if (!course.branding || !course.tags || !course.disclaimer || course.acknowledgementRequired !== true) throw new Error(`Course ${course.id} is missing governed policy metadata`);
            if (course.certificate?.isProfessionalCertification !== false || course.certificate?.isComplianceEvidence !== false) throw new Error(`Course ${course.id} has invalid completion credential metadata`);
          }
          console.log(`Validated ${catalog.courses.length} publishable course(s)`);
          NODE

      - name: Upload governed catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: obserra-academy-governed-catalog
          path: catalog/academy-course-catalog.json
          if-no-files-found: error
          retention-days: 30

      - name: Require website synchronization token
        env:
          ACADEMY_WEBSITE_TOKEN: ${{ secrets.ACADEMY_WEBSITE_TOKEN }}
        run: test -n "$ACADEMY_WEBSITE_TOKEN"

      - name: Trigger website catalog synchronization
        env:
          GH_TOKEN: ${{ secrets.ACADEMY_WEBSITE_TOKEN }}
          STUDIO_REF: ${{ github.ref_name }}
          TARGET_REF: ${{ inputs.target_ref || 'main' }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/jblan2026-hub/obserra-website/dispatches \
            --data "{\"event_type\":\"academy_catalog_published\",\"client_payload\":{\"ref\":\"$STUDIO_REF\",\"target_ref\":\"$TARGET_REF\"}}"
