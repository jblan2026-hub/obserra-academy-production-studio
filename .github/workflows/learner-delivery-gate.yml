name: Academy Learner Delivery Gate

on:
  pull_request:
    paths:
      - "app/api/delivery/**"
      - "lib/academy-delivery-*.ts"
      - "lib/academy-storage.ts"
      - "studio/build-course.mjs"
      - "studio/load-courses-to-lcms.mjs"
      - "supabase/migrations/**"
      - "tests/academy-delivery-contract.test.ts"
      - "docs/LEARNER_DELIVERY_BACKEND.md"
      - ".env.example"
      - "package.json"
      - ".github/workflows/learner-delivery-gate.yml"
  push:
    branches: [main]
    paths:
      - "app/api/delivery/**"
      - "lib/academy-delivery-*.ts"
      - "lib/academy-storage.ts"
      - "studio/build-course.mjs"
      - "studio/load-courses-to-lcms.mjs"
      - "supabase/migrations/**"
      - "tests/academy-delivery-contract.test.ts"
      - "docs/LEARNER_DELIVERY_BACKEND.md"
      - ".env.example"
      - "package.json"
      - ".github/workflows/learner-delivery-gate.yml"

permissions:
  contents: read

jobs:
  learner-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://studio:studio@127.0.0.1:5432/studio?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Run learner delivery contract tests
        run: npm test

      - name: Type check Studio and delivery routes
        run: npx tsc --noEmit

      - name: Verify release loader fails closed with current drafts
        run: node studio/load-courses-to-lcms.mjs --dry-run
