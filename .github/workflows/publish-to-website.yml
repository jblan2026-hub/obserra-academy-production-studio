name: Publish Approved Academy Catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "catalog/academy-course-catalog.json"
      - "courses/**/course-manifest.json"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Studio
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate and regenerate approved catalog
        run: npm run verify

      - name: Confirm publishable contract
        run: |
          node -e 'const c=require("./catalog/academy-course-catalog.json"); if(!Array.isArray(c.courses)) process.exit(1); for(const x of c.courses){if(!x.id||!x.title||!x.duration||!x.description||!Array.isArray(x.modules)||!x.license||!x.certificate) process.exit(1)}'

      - name: Notify website repository
        env:
          GH_TOKEN: ${{ secrets.ACADEMY_STUDIO_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/jblan2026-hub/obserra-website/dispatches \
            --data '{"event_type":"academy_catalog_published","client_payload":{"source":"obserra-academy-production-studio","classification":"OBSERRA PROPRIETARY INFORMATION. NOT FOR DISTRIBUTION."}}'
