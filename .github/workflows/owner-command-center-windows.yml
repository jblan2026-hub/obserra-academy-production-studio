name: Build Owner Command Center Windows Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/owner-ai-command-center-production
    paths:
      - "owner-command-center/**"
      - "studio/**"
      - "courses/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/owner-command-center-windows.yml"
  pull_request:
    branches:
      - main
    paths:
      - "owner-command-center/**"
      - "studio/**"
      - "courses/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/owner-command-center-windows.yml"

permissions:
  contents: read

concurrency:
  group: owner-command-center-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-gate:
    name: Validate, package, and verify Windows release
    runs-on: windows-2025
    timeout-minutes: 105
    defaults:
      run:
        working-directory: owner-command-center
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            owner-command-center/package-lock.json

      - name: Install Studio dependencies
        working-directory: .
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Command Center dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate source syntax and policy JSON
        shell: pwsh
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check electron/connectors.cjs
          node --check electron/academy-studio.cjs
          node --check electron/academy-preview.cjs
          node --check electron/owner-ai.cjs
          node --check electron/discovery.cjs
          node --check electron/site-discovery.cjs
          node --check electron/vulnerability-scan.cjs
          node --check electron/threat-policy.cjs
          node --check electron/security-enforcement.cjs
          node --check electron/trend-store.cjs
          node --check electron/ai-remediation.cjs
          node --check electron/remediation-queue.cjs
          node --check src/app.js
          node --check src/security-dashboard.js
          node --check src/refresh-15s.js
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('policy/connector-catalog.json','utf8')); console.log('JSON policy validation passed')"

      - name: Run Command Center security and Academy Operations gates
        run: npm run verify

      - name: Execute Studio and Command Center 500x workload gate
        working-directory: .
        run: npm run test:500x-workload

      - name: Execute Studio and Command Center 1000x remediation gate
        working-directory: .
        run: npm run test:1000x-remediation

      - name: Build installer, portable executable, and removable-media bundle
        shell: pwsh
        run: ./scripts/build-removable-media-package.ps1 -TargetHostname obserra
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify release contents, bootstrap profile, and cryptographic integrity
        shell: pwsh
        run: |
          function Get-Sha256Hex {
            param([Parameter(Mandatory = $true)][string]$Path)
            $stream = [System.IO.File]::OpenRead($Path)
            try {
              $algorithm = [System.Security.Cryptography.SHA256]::Create()
              try { return ([BitConverter]::ToString($algorithm.ComputeHash($stream))).Replace('-','') }
              finally { $algorithm.Dispose() }
            } finally { $stream.Dispose() }
          }

          $media = Join-Path $PWD "release-media"
          if (-not (Test-Path $media)) { throw "release-media directory missing" }

          $installer = Get-ChildItem $media -Filter "Obserra-Owner-AI-Command-Center-*.exe" | Where-Object { $_.Name -notlike "*Portable*" }
          $portable = Get-ChildItem $media -Filter "Obserra-Owner-AI-Command-Center-Portable-*.exe"
          if (-not $installer) { throw "One-click installer missing" }
          if (-not $portable) { throw "Portable executable missing" }

          $requiredFiles = @(
            "SHA256SUMS.txt",
            "SHA256SUMS.json",
            "Install-Obserra-Command-Center.ps1",
            "Obserra-Command-Center-Bootstrap.json",
            "INSTALL-AND-RECOVERY.md",
            "HIGH-AVAILABILITY.md"
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path (Join-Path $media $file))) { throw "Required release file missing: $file" }
          }

          $bootstrap = Get-Content (Join-Path $media "Obserra-Command-Center-Bootstrap.json") -Raw | ConvertFrom-Json
          if ($bootstrap.schemaVersion -ne "1.0") { throw "Unsupported bootstrap schema" }
          if ($bootstrap.targetHostname -ne "obserra") { throw "Bootstrap target must be machine 'obserra'" }
          if (@($bootstrap.connectors).Count -lt 10) { throw "Bootstrap connector inventory is incomplete" }
          $requiredConnectorIds = @("lcms","academy","website","store","eios","stripe","github","vercel","clerk","localAi")
          foreach ($connectorId in $requiredConnectorIds) {
            if (-not (@($bootstrap.connectors) | Where-Object { $_.id -eq $connectorId })) { throw "Bootstrap connector missing: $connectorId" }
          }

          $installScript = Get-Content (Join-Path $media "Install-Obserra-Command-Center.ps1") -Raw
          foreach ($term in @("Get-FileHash", "TargetHostname", "OBSERRA_COMMAND_CENTER_BOOTSTRAP", "Portable")) {
            if ($installScript -notmatch [regex]::Escape($term)) { throw "Installer script missing required behavior: $term" }
          }

          $manifest = @(Get-Content (Join-Path $media "SHA256SUMS.json") -Raw | ConvertFrom-Json)
          if ($manifest.Count -lt 6) { throw "JSON integrity manifest is incomplete" }
          foreach ($entry in $manifest) {
            $filePath = Join-Path $media $entry.File
            if (-not (Test-Path $filePath)) { throw "Manifest references missing file: $($entry.File)" }
            $actual = Get-Sha256Hex -Path $filePath
            if ($actual -ne $entry.SHA256) { throw "SHA-256 mismatch for $($entry.File)" }
          }

          Write-Host "Windows release gate passed."
          Write-Host "Installer: $($installer.Name)"
          Write-Host "Portable: $($portable.Name)"
          Write-Host "Bootstrap target: $($bootstrap.targetHostname)"

      - name: Upload verified removable-media installer bundle
        uses: actions/upload-artifact@v4
        with:
          name: Obserra-Owner-AI-Command-Center-Windows-${{ github.sha }}
          path: owner-command-center/release-media/**
          if-no-files-found: error
          retention-days: 180
