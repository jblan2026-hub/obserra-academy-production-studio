name: Obserra 40x Enterprise Production Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "app/**"
      - "courses/**"
      - "lib/**"
      - "prisma/**"
      - "studio/**"
      - "owner-command-center/**"
      - "package.json"
      - ".github/workflows/production-contract-release-gate.yml"

permissions:
  contents: read

concurrency:
  group: obserra-40x-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  academy-quality:
    name: Academy tests, validation, schema, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      DATABASE_URL: postgresql://obserra_ci:obserra_ci@127.0.0.1:5432/obserra_ci
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_ci_only_not_a_real_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test
      - run: npm run validate
      - run: npm run catalog
      - run: npm run db:validate
      - run: npm run build

  academy-governance:
    name: Governed course sources, branding, taxonomy, and claims
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate every governed Studio source
        shell: bash
        run: |
          set -euo pipefail
          test -d courses
          test -d studio
          source_count=$(find courses -type f | wc -l | tr -d ' ')
          test "$source_count" -ge 1
          grep -RIlE 'OBSERRA|Obserra' courses studio | head -n 1
          grep -RIlE 'tag|category|topic' courses studio | head -n 1
          grep -RIlE 'certificate|completion credential' courses studio | head -n 1
          grep -RIlE 'informational|not for certification|not a state license' courses studio | head -n 1
          if grep -RInE 'guaranteed certification|guaranteed compliance|certifies compliance' courses studio; then exit 1; fi

  repository-security:
    name: Repository secrets, private keys, and executable policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed credentials and private keys
        shell: bash
        run: |
          set -euo pipefail
          if find . -path './.git' -prune -o -path './node_modules' -prune -o -type f \( -name '*.pem' -o -name '*.pfx' -o -name '*.key' \) -print | grep -q .; then exit 1; fi
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules '(sk_live_[A-Za-z0-9]{16,}|whsec_[A-Za-z0-9]{16,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' .; then exit 1; fi
          test -s package.json
          test -s prisma/schema.prisma

  website-route-matrix:
    name: Production domains, critical routes, content, and redirect matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate public route matrix
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            https://www.obserrallc.com/ \
            https://obserrallc.com/ \
            https://www.obserrallc.com/academy \
            https://www.obserrallc.com/contact \
            https://www.obserrallc.com/apps; do
            code=$(curl --location --silent --show-error --max-time 30 -D /tmp/headers.txt -o /tmp/body.html -w '%{http_code}' "$url")
            test "$code" = "200"
            test -s /tmp/body.html
            grep -Eqi 'Obserra' /tmp/body.html
          done
      - name: Validate canonical domain redirect behavior
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --max-time 30 -D /tmp/root-headers.txt -o /dev/null -w '%{http_code}' https://obserrallc.com/)
          case "$code" in 200|301|302|307|308) ;; *) exit 1 ;; esac

  website-security-headers:
    name: Production transport and browser security controls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate headers on representative routes
        shell: bash
        run: |
          set -euo pipefail
          for path in / /academy /contact /api/academy/commerce-health; do
            curl --silent --show-error --max-time 30 -D /tmp/headers.txt -o /dev/null "https://www.obserrallc.com${path}"
            grep -Eqi '^strict-transport-security:' /tmp/headers.txt
            grep -Eqi '^content-security-policy:' /tmp/headers.txt
            grep -Eqi '^x-content-type-options: nosniff' /tmp/headers.txt
            grep -Eqi '^x-frame-options: (DENY|SAMEORIGIN)' /tmp/headers.txt
            grep -Eqi '^referrer-policy:' /tmp/headers.txt
            grep -Eqi '^permissions-policy:' /tmp/headers.txt
          done

  legal-brand-and-catalog:
    name: Full legal company name, Academy disclaimers, and 60 course publication
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate public legal and catalog evidence
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 30 https://www.obserrallc.com/academy -o /tmp/academy.html
          grep -Eqi 'Obserra Executive Protection (&|&amp;) Intelligence LLC' /tmp/academy.html
          grep -Eqi '60[^0-9]+(paid )?courses|numberOfItems[^0-9]+60' /tmp/academy.html
          grep -Eqi 'not a state license|not.*third.party professional certification|not for certification' /tmp/academy.html
          grep -Eqi 'action=["'"']?/api/academy/checkout["'"']?' /tmp/academy.html
          grep -Eqi 'method=["'"']?post["'"']?' /tmp/academy.html

  commerce-contract:
    name: Live Stripe readiness, fulfillment states, and claim policy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate governed live commerce health contract
        run: node studio/verify-live-academy-commerce-contract.mjs --health

  commerce-checkout-matrix:
    name: Governed Academy checkout boundary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate current POST checkout contract and licensing hold
        run: node studio/verify-live-academy-commerce-contract.mjs --checkout

  webhook-boundary:
    name: Stripe webhook signature enforcement and method containment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Reject unsigned webhook requests
        shell: bash
        run: |
          set -euo pipefail
          webhook_code=$(curl --silent --show-error --max-time 30 -X POST -H 'content-type: application/json' -d '{}' -o /tmp/webhook.json -w '%{http_code}' https://www.obserrallc.com/api/webhook/stripe)
          test "$webhook_code" = "400"
          grep -Eqi 'Webhook not configured|Invalid webhook signature' /tmp/webhook.json
      - name: Ensure webhook route never returns 5xx for unsupported GET
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --max-time 30 -o /tmp/get-body.txt -w '%{http_code}' https://www.obserrallc.com/api/webhook/stripe)
          test "$code" -lt 500

  identity-containment:
    name: Identity degradation and protected access containment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify protected routes never fail open or return 5xx
        shell: bash
        run: |
          set -euo pipefail
          for path in /sign-in /portal /admin; do
            code=$(curl --silent --show-error --max-time 30 -D /tmp/access-headers.txt -o /tmp/access-body.html -w '%{http_code}' "https://www.obserrallc.com${path}")
            test "$code" -lt 500
            case "$code" in 200|302|303|307|308|401|403) ;; *) exit 1 ;; esac
          done
      - name: Require explicit identity state
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 30 -D /tmp/identity-headers.txt -o /dev/null https://www.obserrallc.com/api/academy/commerce-health
          grep -Eqi '^x-obserra-identity-status: (operational|configuration-required)' /tmp/identity-headers.txt

  command-center-governance:
    name: Owner Command Center source, owner control, and connector governance
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        working-directory: owner-command-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run verify
      - name: Validate source and governed connector catalog
        shell: pwsh
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check electron/connectors.cjs
          node --check src/app.js
          $catalog = Get-Content policy/connector-catalog.json -Raw | ConvertFrom-Json
          if (-not $catalog.resources -or @($catalog.resources).Count -lt 3) { throw 'Resource catalog incomplete' }
          if ($catalog.defaultControlMode -notmatch 'read') { throw 'Catalog must default to read only' }
          foreach ($resource in @($catalog.resources)) {
            if (-not $resource.writeCapabilitiesRequireOwnerApproval) { throw "Owner approval missing for $($resource.id)" }
          }

  command-center-release:
    name: Windows installer, portable executable, removable media, and integrity
    runs-on: windows-2025
    timeout-minutes: 75
    defaults:
      run:
        working-directory: owner-command-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run package:media
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify release inventory and SHA256 manifests
        shell: pwsh
        run: |
          $media = Join-Path $PWD 'release-media'
          $required = @('SHA256SUMS.txt','SHA256SUMS.json','Install-Obserra-Command-Center.ps1','INSTALL-AND-RECOVERY.md','HIGH-AVAILABILITY.md')
          foreach ($file in $required) { if (-not (Test-Path (Join-Path $media $file))) { throw "Missing $file" } }
          $installer = Get-ChildItem $media -Filter 'Obserra-Owner-AI-Command-Center-*.exe' | Where-Object { $_.Name -notlike '*Portable*' }
          $portable = Get-ChildItem $media -Filter 'Obserra-Owner-AI-Command-Center-Portable-*.exe'
          if (-not $installer -or -not $portable) { throw 'Executable inventory incomplete' }
          $manifest = @(Get-Content (Join-Path $media 'SHA256SUMS.json') -Raw | ConvertFrom-Json)
          if ($manifest.Count -lt 5) { throw 'Hash manifest incomplete' }
          foreach ($entry in $manifest) {
            $path = Join-Path $media $entry.File
            if (-not (Test-Path $path)) { throw "Manifest file missing: $($entry.File)" }
            if ((Get-FileHash -Algorithm SHA256 -Path $path).Hash -ne $entry.SHA256) { throw "Hash mismatch for $($entry.File)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: obserra-40x-command-center-release-${{ github.sha }}
          path: owner-command-center/release-media/**
          if-no-files-found: error
          retention-days: 180

  resilience-and-recovery:
    name: High availability, recovery, rollback, and removable media evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate resilience documentation
        shell: bash
        run: |
          set -euo pipefail
          test -s owner-command-center/HIGH-AVAILABILITY.md
          test -s owner-command-center/INSTALL-AND-RECOVERY.md
          grep -Eqi 'standby|failover|backup|recovery' owner-command-center/HIGH-AVAILABILITY.md
          grep -Eqi 'install|restore|rollback|removable' owner-command-center/INSTALL-AND-RECOVERY.md

  release-evidence:
    name: Immutable cross-project release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate signed-by-hash evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          printf '{"commit":"%s","repository":"%s","workflow":"%s","runId":"%s","actor":"%s","commerceContract":"academy-commerce-health-v1","claimPolicy":"purchaser-email-match-v1","gate":"40x"}\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_WORKFLOW" "$GITHUB_RUN_ID" "$GITHUB_ACTOR" > release-evidence/manifest.json
          sha256sum release-evidence/manifest.json > release-evidence/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: obserra-40x-enterprise-evidence-${{ github.sha }}
          path: release-evidence/**
          if-no-files-found: error
          retention-days: 365

  promotion:
    name: Final 40x enterprise production promotion
    runs-on: ubuntu-latest
    needs:
      - academy-quality
      - academy-governance
      - repository-security
      - website-route-matrix
      - website-security-headers
      - legal-brand-and-catalog
      - commerce-contract
      - commerce-checkout-matrix
      - webhook-boundary
      - identity-containment
      - command-center-governance
      - command-center-release
      - resilience-and-recovery
      - release-evidence
    steps:
      - run: |
          echo 'Academy quality, governance, schema, catalog, and production build: PASSED'
          echo 'Website routes, legal branding, 60 course publication, and browser security: PASSED'
          echo 'Stripe commerce, webhook enforcement, fulfillment contract, and secure claim policy: PASSED'
          echo 'Identity degradation and protected route containment: PASSED'
          echo 'Owner Command Center governance and Windows release: PASSED'
          echo 'Recovery, high availability, removable media, integrity, and immutable evidence: PASSED'
          echo 'Obserra 40x enterprise production gate is promotion ready.'