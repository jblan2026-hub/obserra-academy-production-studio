name: Generate Owner Command Center lockfile

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/generate-owner-command-center-lockfile.yml"

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'fix/owner-command-center-lockfile-20260820'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Generate deterministic Command Center lockfile
        working-directory: owner-command-center
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Prove clean install and Command Center verification
        working-directory: owner-command-center
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify

      - name: Commit only the generated lockfile and self-delete this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/generate-owner-command-center-lockfile.yml
          git config user.name "Obserra CI"
          git config user.email "obserra-ci@users.noreply.github.com"
          git add owner-command-center/package-lock.json .github/workflows/generate-owner-command-center-lockfile.yml
          test -f owner-command-center/package-lock.json
          git diff --cached --exit-code -- owner-command-center/package.json || true
          git commit -m "fix(ci): add deterministic owner command center lockfile"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
