name: Academy 61 Course Completion Only
run-name: manual 61-course completion fallback • ${{ github.ref_name }} • ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: academy-61-course-completion-only-manual
  cancel-in-progress: false

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_PROGRESS: "false"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
  OBSERRA_PORTFOLIO_WORKER_COUNT: "36"
  OBSERRA_APPLICATION_WORKER_COUNT: "0"
  ACADEMY_COURSE_WORKER_COUNT: "36"
  ACADEMY_WORKER_MODE: interchangeable-course-production
  ACADEMY_EXPECTED_SURGE_COURSES: "61"
  ACADEMY_EXPECTED_REVIEW_COURSES: "61"
  ACADEMY_SURGE_EXCLUDED_COURSE_IDS: __none__
  ACADEMY_MINIMUM_LESSON_WORDS: "1200"
  ACADEMY_MINIMUM_EXACT_SOURCES_PER_COURSE: "2"
  ACADEMY_EXECUTION_MODE: local-only-zero-commercial-api-cost
  ACADEMY_RESEARCH_CONCURRENCY: "1"
  ACADEMY_AUTHORING_CONCURRENCY: "1"
  ACADEMY_REVIEW_CONCURRENCY: "1"
  ACADEMY_LOCAL_CANARY_COUNT: "1"
  ACADEMY_AUTHORING_MAX_ATTEMPTS: "2"
  ACADEMY_RESEARCH_MAX_ATTEMPTS: "2"
  ACADEMY_REVIEW_MAX_ATTEMPTS: "2"
  ACADEMY_AUTHORING_PROCESS_TIMEOUT_MS: "5400000"
  ACADEMY_AUTHORING_REQUEST_TIMEOUT_MS: "3600000"
  ACADEMY_AUTHORING_CHECKPOINTS_REQUIRED: "true"
  ACADEMY_FREE_SOURCE_MAX_BYTES: "8388608"
  ACADEMY_FREE_SOURCE_TIMEOUT_MS: "30000"
  ACADEMY_FREE_SOURCE_EXCERPT_CHARACTERS: "12000"
  ACADEMY_AUTHORING_PROVIDER: openai
  ACADEMY_RESEARCH_PROVIDER: openai
  ACADEMY_REVIEW_PROVIDER: openai
  OPENAI_API_URL: http://127.0.0.1:11435/v1/responses
  OPENAI_API_KEY: ollama-local-no-secret
  OPENAI_AUTHORING_MODEL: qwen2.5:7b-instruct
  OPENAI_RESEARCH_MODEL: qwen2.5:7b-instruct
  OPENAI_REVIEW_MODEL: qwen2.5:7b-instruct
  OPENAI_RESEARCH_MAX_OUTPUT_TOKENS: "20000"
  OPENAI_REVIEW_MAX_OUTPUT_TOKENS: "16000"
  LOCAL_AI_BASE_URL: http://127.0.0.1:11434
  LOCAL_AI_MODEL: qwen2.5:7b-instruct
  LOCAL_AI_TIMEOUT_MS: "3600000"
  ACADEMY_LOCAL_MODEL_CONTEXT: "32768"
  ACADEMY_LOCAL_CONTEXT_MAX_CHARS: "100000"
  OLLAMA_NO_CLOUD: "1"
  OLLAMA_KEEP_ALIVE: "30m"
  STUDIO_ALLOW_PAID_AI: "false"
  ACADEMY_LOCAL_TTS_MODEL: en_US-joe-medium
  ACADEMY_LOCAL_TTS_DATA_DIR: /tmp/academy-piper-voices
  STUDIO_OWNER_ORGANIZATION_ID: org_obserra_academy
  STUDIO_OWNER_ORGANIZATION_NAME: Obserra Academy
  ACADEMY_CHECKPOINT_GATEWAY_URL: https://nwxnyqlyzyufgoadtqxs.supabase.co/functions/v1/academy-checkpoint-gateway
  ACADEMY_PRIVATE_BACKUP_REPOSITORY: jblan2026-hub/ObserraAI
  ACADEMY_PRIVATE_BACKUP_BRANCH: academy-backups
  ACADEMY_PRIVATE_BACKUP_ROOT: private-backups/academy/61-course-completion

jobs:
  complete-all-courses:
    name: Manual local-only finish, review, render, verify, and private-backup fallback
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ACADEMY_PRIVATE_BACKUP_TOKEN: ${{ secrets.ACADEMY_PRIVATE_BACKUP_TOKEN || secrets.OBSERRA_GITHUB_TOKEN || secrets.GH_PAT }}
    steps:
      - name: Checkout course production source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install local media, Python, and repository tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ffmpeg git-lfs python3 python3-venv curl ca-certificates
          git lfs install --local
          python3 -m venv .academy-tools
          .academy-tools/bin/python -m pip install --disable-pip-version-check --no-cache-dir "piper-tts==1.5.0"
          echo "${GITHUB_WORKSPACE}/.academy-tools/bin" >> "$GITHUB_PATH"

      - name: Install pinned Ollama local runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION=0.30.8 sh
          ollama --version

      - name: Start Ollama in local-only mode and pull Apache-2.0 model
        shell: bash
        run: |
          set -euo pipefail
          export OLLAMA_NO_CLOUD=1
          nohup ollama serve > /tmp/academy-ollama.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "$LOCAL_AI_MODEL"
          ollama list

      - name: Download local Piper voice model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ACADEMY_LOCAL_TTS_DATA_DIR"
          python3 -m piper.download_voices "$ACADEMY_LOCAL_TTS_MODEL" --data-dir "$ACADEMY_LOCAL_TTS_DATA_DIR"
          find "$ACADEMY_LOCAL_TTS_DATA_DIR" -maxdepth 1 -type f -print

      - name: Start zero-cost Responses compatibility proxy
        shell: bash
        run: |
          set -euo pipefail
          nohup node studio/local-ollama-responses-proxy.mjs > /tmp/academy-local-proxy.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11435/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11435/health

      - name: Verify local toolchain
        shell: bash
        run: |
          set -euo pipefail
          node --version
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          python3 -c "import piper; print('Piper import OK')"
          git lfs version
          gh --version
          test "$OPENAI_API_URL" = "http://127.0.0.1:11435/v1/responses"
          test "$OPENAI_API_KEY" = "ollama-local-no-secret"
          test "$STUDIO_ALLOW_PAID_AI" = "false"
          test "$OLLAMA_NO_CLOUD" = "1"

      - name: Require private backup credential before protected generation
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ACADEMY_PRIVATE_BACKUP_TOKEN:-}" ]; then
            echo "A private GitHub backup token is required. Public-repository protected output is prohibited."
            exit 2
          fi
          export GH_TOKEN="$ACADEMY_PRIVATE_BACKUP_TOKEN"
          visibility="$(gh repo view "$ACADEMY_PRIVATE_BACKUP_REPOSITORY" --json visibility --jq '.visibility')"
          test "$visibility" = "PRIVATE"
          echo "[Academy Studio] Private backup target verified: ${ACADEMY_PRIVATE_BACKUP_REPOSITORY}/${ACADEMY_PRIVATE_BACKUP_BRANCH}"

      - name: Verify all 36 workers are assigned to Academy only
        run: npm run verify:academy-worker-contract

      - name: Preflight protected OIDC checkpoint gateway
        run: node --input-type=module -e "import('./studio/academy-hollywood-checkpoints.mjs').then(async m => { const r = await m.bootstrapHollywoodCheckpointTable(); if (!r.bootstrapped) process.exit(2); console.log('[Academy Studio] Protected checkpoint gateway ready:', r.transport); })"

      - name: Apply governed course policy
        run: npm run apply:course-policy

      - name: Restore matching protected course checkpoints
        run: node studio/restore-academy-hollywood-checkpoints.mjs

      - name: Reject stale restored course packages
        run: node studio/prune-stale-restored-course-packages.mjs

      - name: Download canonical authoritative sources without model API cost
        run: node studio/fetch-free-authoritative-source-cache.mjs

      - name: Build deterministic source context from authoritative registry and cache
        run: node studio/build-free-course-source-context.mjs

      - name: Research all missing current evidence through local Ollama only
        run: node studio/research-all-61-courses.mjs

      - name: Normalize local research provenance
        run: node studio/normalize-local-ollama-evidence.mjs

      - name: Merge researched primary sources into governed runtime registry
        run: node studio/merge-61-course-research-registry.mjs

      - name: Author and checkpoint all 61 course packages through local Ollama only
        run: node studio/author-all-61-cinematic-parallel.mjs

      - name: Normalize local authoring provenance
        run: node studio/normalize-local-ollama-evidence.mjs

      - name: Materialize all learner, instructor, assessment, accessibility, rights, and certificate assets
        run: node studio/materialize-hollywood-course-assets.mjs

      - name: Validate all 61 structural course packages and exact source mappings
        run: node studio/validate-academy-hollywood-surge.mjs

      - name: Independently review all courses through local Ollama only
        run: node studio/review-all-61-courses.mjs

      - name: Normalize local independent-review provenance
        run: node studio/normalize-local-ollama-evidence.mjs

      - name: Render final 1080p module media locally with Piper and FFmpeg
        run: node studio/render-all-61-local-media.mjs

      - name: Verify all 61 course content, materials, sources, and every final module video
        run: node studio/verify-all-61-course-completion.mjs

      - name: Assert zero commercial model and media API use
        shell: bash
        run: |
          set -euo pipefail
          test "$OPENAI_API_URL" = "http://127.0.0.1:11435/v1/responses"
          test "$OPENAI_API_KEY" = "ollama-local-no-secret"
          test "$STUDIO_ALLOW_PAID_AI" = "false"
          test "$OLLAMA_NO_CLOUD" = "1"
          test -f catalog/academy-local-ollama-evidence-summary.json
          test -f catalog/academy-61-local-media-render-summary.json
          node - <<'NODE'
          const fs = require('node:fs');
          const model = JSON.parse(fs.readFileSync('catalog/academy-local-ollama-evidence-summary.json','utf8'));
          const media = JSON.parse(fs.readFileSync('catalog/academy-61-local-media-render-summary.json','utf8'));
          if (Number(model.estimatedApiCostUsd) !== 0 || model.externalPaidApiUsed !== false) throw new Error('Model API evidence is not zero-cost.');
          if (Number(media.estimatedApiCostUsd) !== 0 || media.externalPaidMediaProviderUsed !== false) throw new Error('Media evidence is not zero-cost.');
          console.log('Zero commercial model/media API use verified from generated evidence.');
          NODE

      - name: Back up all finished materials, videos, certificates, and evidence to private GitHub
        shell: bash
        run: bash studio/backup-61-courses-to-private-github.sh

      - name: Record completion summary
        if: always()
        run: |
          {
            echo "## Academy 61 Course Completion Only"
            echo "- Objective: finish all 61 courses and required materials only"
            echo "- Model generation: local Ollama only; commercial model API cost target: $0"
            echo "- Media generation: local Piper + FFmpeg only; commercial media API cost target: $0"
            echo "- Ollama cloud features: disabled"
            echo "- Total logical Academy workers: 36"
            echo "- Application workers: 0"
            echo "- Course count required: 61"
            echo "- Unresolved factual references allowed: no"
            echo "- Independent content review minimum: 90/100 in every dimension"
            echo "- Final module videos: playable decode, 1080p minimum, governed audio, captions, transcript, audio description, rights linkage"
            echo "- Protected outputs are not uploaded as public-repository workflow artifacts"
            echo "- Required private GitHub backup: ${ACADEMY_PRIVATE_BACKUP_REPOSITORY}/${ACADEMY_PRIVATE_BACKUP_BRANCH}/${ACADEMY_PRIVATE_BACKUP_ROOT}"
            echo "- Completion claim is valid only if final 61-course evidence verification and private backup both pass"
          } >> "$GITHUB_STEP_SUMMARY"
