name: Obserra Postmerge Production Evidence

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "courses/**"
      - "lib/**"
      - "prisma/**"
      - "studio/**"
      - "owner-command-center/**"
      - "package.json"
      - ".github/workflows/**"

permissions:
  contents: read
  statuses: write

concurrency:
  group: obserra-postmerge-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    name: Studio build and governed catalog
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://obserra_ci:obserra_ci@127.0.0.1:5432/obserra_ci
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_ci_only_not_a_real_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test
      - run: npm run validate
      - run: npm run catalog
      - run: npm run db:validate
      - run: npm run build
      - name: Validate branding, tags, disclaimer, and completion language
        shell: bash
        run: |
          set -euo pipefail
          grep -RIlE 'OBSERRA|Obserra' courses studio | head -n 1
          grep -RIlE 'tag|category|topic' courses studio | head -n 1
          grep -RIlE 'informational|information only|not for certification|not certification' courses studio | head -n 1
          grep -RIlE 'completion|credential|certificate of completion' courses studio | head -n 1
          if grep -RInE 'guaranteed certification|guaranteed compliance|certifies compliance' courses studio; then exit 1; fi

  production-web:
    name: Live website, Academy, identity boundary, and security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate public domains and security headers
        shell: bash
        run: |
          set -euo pipefail
          for url in https://www.obserrallc.com https://obserrallc.com; do
            curl --fail --location --silent --show-error --max-time 30 -D /tmp/headers.txt -o /tmp/site.html "$url"
            test -s /tmp/site.html
            grep -Eqi 'Obserra' /tmp/site.html
            grep -Eqi 'strict-transport-security' /tmp/headers.txt
            grep -Eqi 'content-security-policy' /tmp/headers.txt
            grep -Eqi 'x-content-type-options' /tmp/headers.txt
            grep -Eqi 'x-frame-options' /tmp/headers.txt
          done
      - name: Validate Academy catalog and protected checkout
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 30 https://www.obserrallc.com/academy -o /tmp/academy.html
          grep -Eqi 'Obserra Academy' /tmp/academy.html
          grep -Eqi '60[^0-9]+(paid )?courses|numberOfItems[^0-9]+60' /tmp/academy.html
          grep -Eqi 'not a state license|not.*third.party professional certification|not for certification' /tmp/academy.html
          grep -Eqi '/api/academy/checkout\?course=' /tmp/academy.html
          curl --silent --show-error --location --max-time 30 -D /tmp/checkout-headers.txt -o /tmp/checkout.html -w '%{url_effective}' 'https://www.obserrallc.com/api/academy/checkout?course=zero-trust-strategy' > /tmp/checkout-url.txt
          grep -Eqi '/sign-in' /tmp/checkout-url.txt
          grep -Eqi 'SECURE CUSTOMER ACCESS|Sign in to your Obserra account' /tmp/checkout.html
          grep -Eqi 'private|no-store' /tmp/checkout-headers.txt
      - name: Enforce production Clerk identity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 30 https://www.obserrallc.com/sign-in -o /tmp/signin.html
          if grep -Eqi 'pk_test_|clerk\.accounts\.dev|clerkstage\.dev' /tmp/signin.html; then
            echo 'Production identity is still using Clerk development resources.' >&2
            exit 1
          fi
          grep -Eqi 'pk_live_' /tmp/signin.html

  windows-release:
    name: Windows installer, portable package, media, integrity, and recovery
    runs-on: windows-2025
    timeout-minutes: 70
    defaults:
      run:
        working-directory: owner-command-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run verify
      - run: npm run package:media
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify executable inventory and SHA-256 manifests
        shell: pwsh
        run: |
          function Get-Sha256Hex {
            param([Parameter(Mandatory = $true)][string]$Path)
            $stream = [System.IO.File]::OpenRead($Path)
            try {
              $sha = [System.Security.Cryptography.SHA256]::Create()
              try { return ([BitConverter]::ToString($sha.ComputeHash($stream))).Replace('-','') }
              finally { $sha.Dispose() }
            } finally { $stream.Dispose() }
          }
          $media = Join-Path $PWD 'release-media'
          $required = @('SHA256SUMS.txt','SHA256SUMS.json','Install-Obserra-Command-Center.ps1','INSTALL-AND-RECOVERY.md','HIGH-AVAILABILITY.md')
          foreach ($file in $required) { if (-not (Test-Path (Join-Path $media $file))) { throw "Missing $file" } }
          $installer = Get-ChildItem $media -Filter 'Obserra-Owner-AI-Command-Center-*.exe' | Where-Object { $_.Name -notlike '*Portable*' }
          $portable = Get-ChildItem $media -Filter 'Obserra-Owner-AI-Command-Center-Portable-*.exe'
          if (-not $installer -or -not $portable) { throw 'Executable inventory incomplete' }
          $manifest = @(Get-Content (Join-Path $media 'SHA256SUMS.json') -Raw | ConvertFrom-Json)
          if ($manifest.Count -lt 5) { throw 'Hash manifest incomplete' }
          foreach ($entry in $manifest) {
            $path = Join-Path $media $entry.File
            if ((Get-Sha256Hex -Path $path) -ne $entry.SHA256) { throw "Hash mismatch for $($entry.File)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: postmerge-command-center-release-${{ github.sha }}
          path: owner-command-center/release-media/**
          if-no-files-found: error
          retention-days: 180

  publish-status:
    name: Publish production evidence status
    runs-on: ubuntu-latest
    if: always()
    needs:
      - studio
      - production-web
      - windows-release
    steps:
      - name: Publish explicit commit status
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              studio: '${{ needs.studio.result }}',
              productionWeb: '${{ needs.production-web.result }}',
              windowsRelease: '${{ needs.windows-release.result }}'
            };
            const success = Object.values(results).every((value) => value === 'success');
            const state = success ? 'success' : 'failure';
            const description = success
              ? 'Studio, production web, identity, and Windows release evidence passed.'
              : `Production evidence failed: ${JSON.stringify(results)}`.slice(0, 140);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'obserra/postmerge-production-evidence',
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            core.summary
              .addHeading('Obserra Postmerge Production Evidence')
              .addTable([
                [{data: 'Gate', header: true}, {data: 'Result', header: true}],
                ['Studio', results.studio],
                ['Production web and identity', results.productionWeb],
                ['Windows release', results.windowsRelease]
              ])
              .write();
            if (!success) core.setFailed(description);
