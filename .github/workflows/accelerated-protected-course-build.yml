name: Legacy Accelerated Protected Course Build Disabled
run-name: legacy accelerated course build disabled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  superseded:
    name: Confirm authoritative Academy pipeline
    runs-on: ubuntu-24.04
    steps:
      - name: Explain safe production path
        shell: bash
        run: |
          set -euo pipefail
          echo "This legacy workflow is intentionally disabled."
          echo "It previously allowed paid model execution and public workflow artifacts containing protected course output."
          echo "The authoritative production path is .github/workflows/academy-zero-cost-sharded-completion.yml."
          echo "No model, media, database, or protected-content action was performed."
