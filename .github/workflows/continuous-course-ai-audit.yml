name: Continuous Academy Course AI Audit
run-name: Academy protected audit • ${{ github.ref_name }} • ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  pull_request:
    branches:
      - main
      - agent/continue-course-buildout
    paths:
      - "courses/**/course-manifest.json"
      - "policy/elastic-worker-pool-contract.json"
      - "policy/commercial-cinematic-course-production-standard.json"
      - "studio/apply-course-policy.mjs"
      - "studio/audit-course-build-readiness.mjs"
      - "studio/author-course-ai.mjs"
      - "studio/author-course-with-checkpoint.mjs"
      - "studio/author-courses-parallel.mjs"
      - "studio/authoring-checkpoints.mjs"
      - "studio/authoring-provider-errors.mjs"
      - "studio/preflight-authoring-provider.mjs"
      - "studio/provider-http.mjs"
      - "studio/restore-authoring-checkpoints.mjs"
      - "studio/bootstrap-protected-database.mjs"
      - "studio/build-all-courses.mjs"
      - "studio/materialize-commercial-implementation-guidance.mjs"
      - "studio/build-course.mjs"
      - "studio/stage-all-courses.mjs"
      - "studio/collect-authoritative-sources.mjs"
      - "studio/generate-catalog.mjs"
      - "studio/validate-learner-catalog.mjs"
      - "studio/validate-commercial-implementation-guidance.mjs"
      - "studio/validate-commercial-course-release.mjs"
      - "studio/verify-worker-pool-contract.mjs"
      - "studio/verify-commercial-course-production-standard.mjs"
      - "package.json"
      - "prisma/schema.prisma"
      - ".github/workflows/continuous-course-ai-audit.yml"
      - ".gitignore"
  push:
    branches:
      - main
      - agent/continue-course-buildout
      - agent/academy-36-worker-course-surge
    paths:
      - "courses/**/course-manifest.json"
      - "policy/elastic-worker-pool-contract.json"
      - "policy/commercial-cinematic-course-production-standard.json"
      - "studio/apply-course-policy.mjs"
      - "studio/audit-course-build-readiness.mjs"
      - "studio/author-course-ai.mjs"
      - "studio/author-course-with-checkpoint.mjs"
      - "studio/author-courses-parallel.mjs"
      - "studio/authoring-checkpoints.mjs"
      - "studio/authoring-provider-errors.mjs"
      - "studio/preflight-authoring-provider.mjs"
      - "studio/provider-http.mjs"
      - "studio/restore-authoring-checkpoints.mjs"
      - "studio/bootstrap-protected-database.mjs"
      - "studio/build-all-courses.mjs"
      - "studio/materialize-commercial-implementation-guidance.mjs"
      - "studio/build-course.mjs"
      - "studio/stage-all-courses.mjs"
      - "studio/collect-authoritative-sources.mjs"
      - "studio/generate-catalog.mjs"
      - "studio/validate-learner-catalog.mjs"
      - "studio/validate-commercial-implementation-guidance.mjs"
      - "studio/validate-commercial-course-release.mjs"
      - "studio/verify-worker-pool-contract.mjs"
      - "studio/verify-commercial-course-production-standard.mjs"
      - "package.json"
      - "prisma/schema.prisma"
      - ".github/workflows/continuous-course-ai-audit.yml"
      - ".gitignore"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: continuous-academy-course-ai-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit-author-build:
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          github.head_ref == 'agent/continue-course-buildout' ||
          github.head_ref == 'agent/academy-36-worker-course-surge'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OBSERRA_PORTFOLIO_WORKER_COUNT: 36
      OBSERRA_APPLICATION_WORKER_COUNT: 0
      COMMAND_CENTER_WORKER_ALLOCATION: 8
      IDLE_WORKER_ALLOCATION: 0
      ACADEMY_AUTHORING_PROVIDER: openai
      ACADEMY_AUTHORING_CONCURRENCY: 28
      ACADEMY_STAGING_CONCURRENCY: 28
      ACADEMY_AUTHORING_MAX_ATTEMPTS: 3
      ACADEMY_AUTHORING_RETRY_BASE_MS: 5000
      ACADEMY_AUTHORING_REQUEST_TIMEOUT_MS: 1200000
      ACADEMY_AUTHORING_PROCESS_TIMEOUT_MS: 1500000
      ACADEMY_AUTHORING_PREFLIGHT_TIMEOUT_MS: 120000
      ACADEMY_AUTHORING_CHECKPOINTS_REQUIRED: true
      ACADEMY_EXPECTED_REVIEW_COURSES: 60
      ACADEMY_SUPABASE_PROJECT_REF: nwxnyqlyzyufgoadtqxs
      ACADEMY_SUPABASE_REGION: us-east-1
      ACADEMY_DATABASE_BOOTSTRAP_ALLOWED: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/agent/continue-course-buildout' || github.ref == 'refs/heads/agent/academy-36-worker-course-surge' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'agent/continue-course-buildout' || github.head_ref == 'agent/academy-36-worker-course-surge'))) && 'true' || 'false' }}
      STUDIO_OWNER_ORGANIZATION_ID: org_obserra_academy
      STUDIO_OWNER_ORGANIZATION_NAME: Obserra Academy
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_ORGANIZATION: ${{ secrets.OPENAI_ORGANIZATION }}
      OPENAI_PROJECT: ${{ secrets.OPENAI_PROJECT }}
      DATABASE_URL: ${{ secrets.ACADEMY_DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Studio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark protected build execution started
        continue-on-error: true
        shell: bash
        run: |
          BODY="Protected commercial Academy production started. The governed elastic pool assigns 28 workers to detailed course authoring, references, real-world cases, implementation guidance, assessments, learner materials, cinematic production planning, and compliance staging; 8 workers remain available to the separate Owner Command Center release workstream; 0 workers are assigned to unrelated applications. Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Branch: ${{ github.head_ref || github.ref_name }}. Commit: ${{ github.sha }}. Publication, checkout, and Hollywood-grade completion claims remain disabled until exact media, source, accessibility, rights, security, release, and owner-acceptance evidence passes."
          gh issue edit 17 --body "$BODY" || true

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Normalize protected secret formatting
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const output = process.env.GITHUB_ENV;
          if (!output) throw new Error('GITHUB_ENV is unavailable.');

          function trimOuterQuotes(value) {
            const quoted = (value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"));
            return quoted ? value.slice(1, -1).trim() : value;
          }

          function stripDatabaseAssignment(value) {
            const match = value.match(/^(?:ACADEMY_DATABASE_URL|DATABASE_URL)\s*=\s*(.+)$/is);
            return match ? trimOuterQuotes(match[1].trim()) : value;
          }

          function normalizeDatabaseUrl(raw) {
            let value = stripDatabaseAssignment(trimOuterQuotes(raw.trim()));
            if (!value) return '';
            if (/\r|\n/.test(value)) throw new Error('DATABASE_URL contains an unexpected newline.');

            if (!/^postgres(?:ql)?:\/\//i.test(value)) {
              const projectRef = String(process.env.ACADEMY_SUPABASE_PROJECT_REF ?? '').trim();
              const region = String(process.env.ACADEMY_SUPABASE_REGION ?? '').trim();
              if (!projectRef || !region) {
                throw new Error('Supabase project metadata is required when ACADEMY_DATABASE_URL contains only the protected database password.');
              }
              const username = `postgres.${projectRef}`;
              const host = `aws-0-${region}.pooler.supabase.com`;
              value = `postgresql://${encodeURIComponent(username)}:${encodeURIComponent(value)}@${host}:5432/postgres?schema=public&sslmode=require&connect_timeout=30`;
            }

            try {
              const parsed = new URL(value);
              if (!['postgres:', 'postgresql:'].includes(parsed.protocol)) throw new Error('invalid protocol');
              return parsed.toString();
            } catch {
              const schemeEnd = value.indexOf('://');
              const scheme = value.slice(0, schemeEnd + 3);
              const remainder = value.slice(schemeEnd + 3);
              const at = remainder.lastIndexOf('@');
              if (at <= 0) throw new Error('DATABASE_URL must include PostgreSQL credentials and a host.');

              const credentials = remainder.slice(0, at);
              const hostAndPath = remainder.slice(at + 1);
              const colon = credentials.indexOf(':');
              if (colon <= 0) throw new Error('DATABASE_URL must include a username and password.');

              const username = credentials.slice(0, colon);
              const password = credentials.slice(colon + 1);
              if (!username || !password || !hostAndPath) throw new Error('DATABASE_URL is missing required connection components.');

              let decodedPassword = password;
              try { decodedPassword = decodeURIComponent(password); } catch {}
              const candidate = `${scheme}${encodeURIComponent(username)}:${encodeURIComponent(decodedPassword)}@${hostAndPath}`;
              const parsed = new URL(candidate);
              if (!['postgres:', 'postgresql:'].includes(parsed.protocol)) throw new Error('DATABASE_URL uses an invalid protocol.');
              return parsed.toString();
            }
          }

          const apiKey = trimOuterQuotes(String(process.env.OPENAI_API_KEY ?? '').trim());
          const organization = trimOuterQuotes(String(process.env.OPENAI_ORGANIZATION ?? '').trim());
          const project = trimOuterQuotes(String(process.env.OPENAI_PROJECT ?? '').trim());
          for (const [name, value] of Object.entries({ OPENAI_API_KEY: apiKey, OPENAI_ORGANIZATION: organization, OPENAI_PROJECT: project })) {
            if (value && /\r|\n/.test(value)) throw new Error(`${name} contains an unexpected newline.`);
            if (value) fs.appendFileSync(output, `${name}=${value}\n`);
          }
          const databaseUrl = normalizeDatabaseUrl(String(process.env.DATABASE_URL ?? ''));
          if (databaseUrl) fs.appendFileSync(output, `DATABASE_URL=${databaseUrl}\n`);
          console.log(`[Academy Studio] Protected secret formatting normalized. authoringCredential=${Boolean(apiKey)} organizationSelector=${Boolean(organization)} projectSelector=${Boolean(project)} databaseCredential=${Boolean(databaseUrl)}`);
          NODE

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Verify elastic worker and commercial production contracts
        run: npm run verify:worker-contract

      - name: Normalize governed course policy before restore and audit
        run: npm run apply:course-policy

      - name: Require protected Academy PostgreSQL credential
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            BODY="Protected Academy PostgreSQL is required before checkpoint restore, course authoring, learner catalog build, or LCMS loading. No authoring workers or publication steps were started. Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
            gh issue edit 17 --body "$BODY" || true
            exit 1
          fi
          echo "Protected Academy PostgreSQL credential is present."

      - name: Bootstrap and verify protected Academy schema and checkpoint table
        id: protected_db_bootstrap
        if: env.ACADEMY_DATABASE_BOOTSTRAP_ALLOWED == 'true'
        continue-on-error: true
        run: npm run db:bootstrap:protected

      - name: Stop invalid or unauthorized protected database bootstrap
        if: env.ACADEMY_DATABASE_BOOTSTRAP_ALLOWED != 'true' || steps.protected_db_bootstrap.outcome != 'success'
        shell: bash
        run: |
          BODY="Protected Academy database authentication, base schema verification, or checkpoint-table bootstrap failed before authoring. No provider requests, publication, or LCMS load were attempted. Review workflow ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          gh issue edit 17 --body "$BODY" || true
          exit 1

      - name: Restore matching protected authoring checkpoints
        run: npm run restore:authoring-checkpoints

      - name: Audit every course from its own manifest
        id: audit
        continue-on-error: true
        run: npm run audit:courses

      - name: Stop unsafe automatic repair for invalid manifests
        if: steps.audit.outputs.blocking_findings != '0'
        shell: bash
        run: |
          TITLE="Academy course manifest alignment failure"
          BODY="The continuous Academy audit found ${{ steps.audit.outputs.blocking_findings }} blocking manifest alignment finding(s). Automatic authoring and build were stopped. Review catalog/continuous-course-audit.json from workflow run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          ISSUE_NUMBER="$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty' || true)"
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" --body "$BODY" || true
          else
            gh issue create --title "$TITLE" --body "$BODY" || true
          fi
          exit 1

      - name: Close resolved manifest blocker issue
        if: steps.audit.outputs.blocking_findings == '0'
        continue-on-error: true
        shell: bash
        run: |
          TITLE="Academy course manifest alignment failure"
          ISSUE_NUMBER="$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty' || true)"
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue close "$ISSUE_NUMBER" --comment "Resolved by workflow run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          fi

      - name: Require protected authoring credential
        if: steps.audit.outputs.authoring_required == 'true'
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            BODY="The remaining owner-review learner build requires OPENAI_API_KEY for protected authoring. Course authoring was not attempted. Restored checkpoints remain protected in Academy PostgreSQL. Latest workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
            gh issue edit 17 --body "$BODY" || true
            exit 1
          fi
          echo "Protected authoring credential is present. Provider capacity must pass before workers launch."

      - name: Verify protected authoring provider capacity and routing
        id: provider_preflight
        if: steps.audit.outputs.authoring_required == 'true'
        continue-on-error: true
        run: npm run preflight:authoring

      - name: Stop unavailable authoring provider before worker launch
        if: steps.audit.outputs.authoring_required == 'true' && steps.provider_preflight.outcome != 'success'
        shell: bash
        run: |
          BODY="The protected Academy authoring provider preflight failed before any course worker launched. Restored checkpoints remain protected in Academy PostgreSQL. No publication or LCMS load was attempted. Review catalog/authoring-provider-preflight.json in workflow ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Confirm the API key belongs to the funded OpenAI organization and project, then rerun."
          gh issue edit 17 --body "$BODY" || true
          exit 1

      - name: AI author detailed commercial courses with immediate checkpoints
        if: steps.audit.outputs.authoring_required == 'true'
        run: npm run author:parallel

      - name: Re-audit restored and newly authored packages before downstream build
        run: |
          npm run audit:courses
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('catalog/continuous-course-audit.json', 'utf8'));
          const authoringFindings = new Set([
            'missing-ai-course-package',
            'stale-ai-course-package',
            'untraceable-ai-course-package',
            'outdated-ai-authoring-policy',
            'unsupported-ai-authoring-envelope',
            'worker-contract-mismatch',
            'production-standard-mismatch',
            'missing-detailed-reference-structure',
            'missing-commercial-production-structure',
          ]);
          const unresolved = report.courses.filter((course) =>
            course.ownerReviewEligible && course.findings.some((finding) => authoringFindings.has(finding))
          );
          if (unresolved.length > 0) {
            console.error(`[Academy Studio] ${unresolved.length} owner-review course package(s) remain unresolved after checkpoint restore and parallel authoring: ${unresolved.map((course) => course.courseId).join(', ')}`);
            process.exit(2);
          }
          NODE

      - name: Materialize detailed learner, implementation, assessment, and cinematic assets
        run: npm run build:all

      - name: Regenerate governed course catalogs
        run: npm run catalog

      - name: Build authoritative source resolution queue
        run: npm run collect:sources

      - name: Validate protected learner catalog and implementation completeness
        run: npm run validate:learner-catalog

      - name: Stage every course at the compliance gate
        run: npm run stage:courses

      - name: Measure commercial release blockers without promoting courses
        id: commercial_release
        continue-on-error: true
        run: npm run validate:commercial-release

      - name: Publish commercial release readiness summary
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'catalog/commercial-release-readiness.json';
          if (!fs.existsSync(path)) {
            console.log('No commercial release readiness report was produced.');
            process.exit(0);
          }
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          const summary = [
            '## Academy commercial cinematic release readiness',
            '',
            `- Ready: ${Boolean(report.ready)}`,
            `- Courses ready: ${report.readyCourses ?? 0}/${report.evaluatedCourses ?? 0}`,
            `- Blockers: ${report.blockerCount ?? 0}`,
            `- Quality tier: ${report.qualityTier ?? 'unknown'}`,
            '',
            report.claimBoundary ?? 'Publication and checkout remain disabled until final acceptance.',
          ].join('\n');
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          console.log(summary);
          NODE

      - name: Validate manifest-defined courses and protected LCMS load plan
        run: |
          npm run audit:courses
          npm run validate
          npm run load:courses:check
          npm test

      - name: Validate protected database schema
        run: npm run db:validate

      - name: Load protected owner-review learner content into LCMS
        run: npm run load:courses

      - name: Close resolved protected Academy database blocker
        continue-on-error: true
        shell: bash
        run: |
          gh issue close 17 --comment "Protected Academy PostgreSQL authentication, checkpoint restore, detailed provider authoring where required, learner catalog validation, compliance staging, Prisma validation, and LCMS owner-review load succeeded in workflow ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. This closes only the database blocker; commercial media, reference, accessibility, rights, release, and owner-acceptance gates remain independently controlled." || true

      - name: Verify protected learner content remains untracked
        run: |
          if git ls-files --error-unmatch catalog/academy-learner-course-catalog.json >/dev/null 2>&1; then
            echo "Protected learner catalog must not be tracked in the public repository."
            exit 1
          fi
          if git ls-files 'courses/*/generated/*' | grep -q .; then
            echo "Protected generated learner packages must not be tracked in the public repository."
            exit 1
          fi

      - name: Detect safe public generated changes
        id: changes
        shell: bash
        run: |
          git add -A courses catalog .gitignore
          git reset -- \
            catalog/academy-learner-course-catalog.json \
            catalog/learner-catalog-readiness.json \
            catalog/parallel-authoring-summary.json \
            catalog/authoring-provider-preflight.json \
            catalog/authoring-checkpoint-restore.json \
            catalog/worker-pool-contract-verification.json \
            catalog/commercial-course-production-standard-verification.json \
            catalog/commercial-implementation-guidance-readiness.json \
            catalog/commercial-implementation-materialization.json \
            catalog/authoritative-source-resolution-queue.json \
            catalog/compliance-staging-summary.json \
            catalog/commercial-release-readiness.json \
            2>/dev/null || true
          git reset -- \
            'courses/*/generated/*' \
            'courses/*/instructor-manuscript.md' \
            'courses/*/learner-guide.md' \
            'courses/*/workbook.md' \
            'courses/*/assessment-bank.json' \
            'courses/*/answer-key.json' \
            'courses/*/visual-brief.md' \
            'courses/*/implementation-and-application-guide.md' \
            'courses/*/source-register.json' \
            'courses/*/reference-applicability-matrix.json' \
            'courses/*/documented-real-world-case-register.json' \
            'courses/*/course-implementation-strategy.json' \
            'courses/*/standards-implementation-map.json' \
            'courses/*/prioritized-recommendations.json' \
            'courses/*/implementation-guidance.json' \
            'courses/*/course-production-bible.json' \
            'courses/*/commercial-production-plan.json' \
            'courses/*/certificate-package.json' \
            'courses/*/commercial-course-stage.json' \
            'courses/*/commercial-release-evidence.json' \
            'courses/*/media/*' \
            'courses/*/video/*' \
            'courses/*/captions/*' \
            'courses/*/transcripts/*' \
            'courses/*/accessibility/*' \
            'courses/*/rights/*' \
            releases \
            2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit safe public course metadata to controlled branch
        if: steps.changes.outputs.changed == 'true' && github.ref == 'refs/heads/agent/continue-course-buildout'
        run: |
          git config user.name "Obserra Academy AI Builder"
          git config user.email "academy-ai-builder@users.noreply.github.com"
          git commit -m "Regenerate governed Academy course metadata"
          git push origin HEAD:agent/continue-course-buildout

      - name: Create governed public metadata branch
        if: steps.changes.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        id: branch
        run: |
          BRANCH="automation/academy-course-build-${GITHUB_RUN_ID}"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          git config user.name "Obserra Academy AI Builder"
          git config user.email "academy-ai-builder@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "Regenerate governed Academy course metadata"
          git push origin "$BRANCH"

      - name: Open draft owner review pull request for safe public metadata
        if: steps.changes.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        run: |
          gh pr create \
            --draft \
            --base main \
            --head "${{ steps.branch.outputs.name }}" \
            --title "Academy governed course metadata alignment" \
            --body "Automated governed build restored or authored and checkpointed the owner-review learner catalog in protected Academy PostgreSQL, validated detailed course and implementation structures, staged packages at the compliance gate, and loaded protected owner-review content into LCMS. This pull request contains only safe public manifests, metadata, and evidence. Publication, checkout, Hollywood-grade completion claims, and commercial release remain separately owner-controlled. Workflow evidence: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."

      - name: Publish non-sensitive audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuous-academy-course-audit-${{ github.run_id }}
          path: |
            catalog/authoring-provider-preflight.json
            catalog/authoring-checkpoint-restore.json
            catalog/continuous-course-audit.json
            catalog/parallel-authoring-summary.json
            catalog/worker-pool-contract-verification.json
            catalog/commercial-course-production-standard-verification.json
            catalog/commercial-implementation-guidance-readiness.json
            catalog/compliance-staging-summary.json
            catalog/commercial-release-readiness.json
            catalog/bulk-build-report.json
            catalog/academy-course-catalog.json
          if-no-files-found: ignore
          retention-days: 180
