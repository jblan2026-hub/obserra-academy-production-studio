name: Studio Authentication Validation

on:
  pull_request:
    branches:
      - feature/chunk-1-studio-foundation
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-professional-duration-manifests:
    name: Repair legacy professional duration manifests
    if: github.event_name == 'pull_request' && github.head_ref == 'hotfix/clerk-failclosed-availability-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out controlled repair branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/clerk-failclosed-availability-20260818
          fetch-depth: 0
          persist-credentials: true
      - name: Repair only the known legacy Professional template signature
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = process.cwd();
          const coursesRoot = path.join(root, 'courses');
          const expectedLegacy = [38, 44, 48, 54, 56];
          const authoritative = [38, 44, 48, 54, 86];
          const parseMinutes = (value) => {
            const match = String(value ?? '').trim().match(/^(\d+)\s*min$/i);
            return match ? Number(match[1]) : null;
          };
          const changed = [];

          for (const entry of fs.readdirSync(coursesRoot, { withFileTypes: true })) {
            if (!entry.isDirectory()) continue;
            const manifestPath = path.join(coursesRoot, entry.name, 'course-manifest.json');
            if (!fs.existsSync(manifestPath)) continue;
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            const course = manifest.course ?? {};
            const release = manifest.release ?? {};
            const modules = Array.isArray(course.modules) ? course.modules : [];
            if (course.level !== 'Professional' || course.duration !== '4.5 hours') continue;
            if (release.status !== 'draft' || release.publishToAcademy !== false) continue;
            const minutes = modules.map((module) => parseMinutes(module.duration));
            if (minutes.length !== expectedLegacy.length || !minutes.every((value, index) => value === expectedLegacy[index])) continue;
            manifest.course.modules = modules.map((module, index) => ({
              ...module,
              duration: `${authoritative[index]} min`,
            }));
            fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
            changed.push(path.relative(root, manifestPath));
          }

          if (changed.length !== 15) {
            console.error(`Expected exactly 15 legacy Professional manifests, repaired ${changed.length}.`);
            process.exit(1);
          }
          console.log(`Repaired ${changed.length} legacy Professional manifests.`);
          for (const file of changed) console.log(file);
          NODE
      - name: Commit repaired manifests only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- courses/*/course-manifest.json
          if git diff --cached --quiet; then
            echo "No duration manifests changed."
            exit 0
          fi
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(catalog): reconcile professional course durations"
          git push origin HEAD:hotfix/clerk-failclosed-availability-20260818

  validate-authenticated-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/obserra_academy_studio?schema=public
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZHVtbXktc3R1ZGlvLWJ1aWxkLWtleQ
      CLERK_SECRET_KEY: sk_test_ZHVtbXktc3R1ZGlvLWJ1aWxkLWtleQ
      STUDIO_MACHINE_TOKEN: ci-only-not-a-production-secret
      NEXT_PUBLIC_APP_ENV: ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Validate course production assets
        run: npm run verify

      - name: Build authenticated Studio application
        run: npm run build

      - name: Verify protected route files
        run: |
          test -f proxy.ts
          test -f app/sign-in/[[...sign-in]]/page.tsx
          test -f app/select-organization/page.tsx
          grep -q "auth.protect" proxy.ts
          grep -q "OrganizationSwitcher" app/page.tsx