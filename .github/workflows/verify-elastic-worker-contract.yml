name: Verify Elastic Worker Pool Contract

on:
  workflow_dispatch:
  push:
    branches:
      - agent/academy-36-worker-course-surge
    paths:
      - "policy/elastic-worker-pool-contract.json"
      - "policy/commercial-cinematic-course-production-standard.json"
      - "studio/worker-pool-contract.mjs"
      - "studio/verify-worker-pool-contract.mjs"
      - "studio/verify-commercial-course-production-standard.mjs"
      - "studio/validate-commercial-implementation-guidance.mjs"
      - "studio/enrich-commercial-implementation-guidance.mjs"
      - "studio/author-course-with-checkpoint.mjs"
      - "studio/author-courses-parallel.mjs"
      - "package.json"
      - ".github/workflows/verify-elastic-worker-contract.yml"
  pull_request:
    branches:
      - main
      - agent/continue-course-buildout
    paths:
      - "policy/elastic-worker-pool-contract.json"
      - "policy/commercial-cinematic-course-production-standard.json"
      - "studio/worker-pool-contract.mjs"
      - "studio/verify-worker-pool-contract.mjs"
      - "studio/verify-commercial-course-production-standard.mjs"
      - "studio/validate-commercial-implementation-guidance.mjs"
      - "studio/enrich-commercial-implementation-guidance.mjs"
      - "studio/author-course-with-checkpoint.mjs"
      - "studio/author-courses-parallel.mjs"
      - "package.json"
      - ".github/workflows/verify-elastic-worker-contract.yml"

permissions:
  contents: read

concurrency:
  group: elastic-worker-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-contract:
    name: Verify 36 worker interchangeable contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout governed source
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify contract structure, allocation, roles, prohibitions, and launcher binding
        run: npm run verify:worker-contract

      - name: Verify package gates invoke both governed verifiers
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const scripts = packageJson.scripts ?? {};
          const workerGate = String(scripts['verify:worker-contract'] ?? '');
          if (!workerGate.includes('studio/verify-worker-pool-contract.mjs')) {
            throw new Error('verify:worker-contract does not invoke the elastic worker contract verifier.');
          }
          if (!workerGate.includes('verify:course-production-standard')) {
            throw new Error('verify:worker-contract does not invoke the commercial course production verifier.');
          }
          if (scripts['verify:course-production-standard'] !== 'node studio/verify-commercial-course-production-standard.mjs') {
            throw new Error('verify:course-production-standard is missing or incorrect.');
          }
          if (!String(scripts['validate:learner-catalog'] ?? '').includes('validate-commercial-implementation-guidance.mjs')) {
            throw new Error('validate:learner-catalog does not enforce the commercial implementation-guidance gate.');
          }
          for (const name of ['verify:public', 'verify:protected', 'verify:70x', 'verify:500x', 'verify:1000x', 'verify:2000x', 'ci']) {
            if (!String(scripts[name] ?? '').includes('verify:worker-contract')) {
              throw new Error(`${name} does not enforce the composite worker and commercial-course contract gate.`);
            }
          }
          console.log('All governed package verification paths enforce both the worker contract and commercial course production standard.');
          NODE

      - name: Upload contract verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: elastic-worker-contract-${{ github.sha }}
          path: |
            catalog/worker-pool-contract-verification.json
            catalog/commercial-course-production-standard-verification.json
          if-no-files-found: error
          retention-days: 365
