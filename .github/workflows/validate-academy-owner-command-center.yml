name: Validate Academy Owner Command Center

on:
  pull_request:
    paths:
      - "owner-command-center/**"
      - ".github/workflows/validate-academy-owner-command-center.yml"
  workflow_dispatch:
    inputs:
      course_id:
        description: "Academy course ID for a real paid-access verification"
        required: false
        type: string
      checkout_session_id:
        description: "Paid Stripe Checkout Session ID to verify against Clerk entitlement readback"
        required: false
        type: string
      academy_url:
        description: "Deployed Academy origin"
        required: false
        default: "https://www.obserrallc.com"
        type: string

permissions:
  contents: read

concurrency:
  group: academy-owner-command-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-source-and-runtime-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked Command Center dependencies
        working-directory: owner-command-center
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate JavaScript syntax
        run: |
          node --check owner-command-center/electron/academy-course-control.cjs
          node --check owner-command-center/electron/main-with-remediation.cjs
          node --check owner-command-center/electron/preload.cjs
          node --check owner-command-center/src/academy-control-ui.js
          node --check owner-command-center/scripts/verify-academy-course-control.mjs
          node --check owner-command-center/scripts/verify-live-academy-purchase.mjs

      - name: Validate complete owner Command Center contract
        working-directory: owner-command-center
        run: npm run verify

  package-windows-command-center:
    needs: validate-source-and-runtime-contracts
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Command Center dependencies
        working-directory: owner-command-center
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Re-run complete verification before packaging
        working-directory: owner-command-center
        shell: pwsh
        run: npm run verify

      - name: Build one-click installer and portable executable
        working-directory: owner-command-center
        shell: pwsh
        run: npm run package:windows

      - name: Confirm distributable executables exist
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path owner-command-center/dist -Filter *.exe -File
          if ($files.Count -lt 2) { throw "Expected both NSIS installer and portable executable." }
          $files | ForEach-Object {
            $hash = Get-FileHash -Algorithm SHA256 $_.FullName
            "{0}  {1}" -f $hash.Hash.ToLowerInvariant(), $_.Name
          } | Set-Content -Encoding utf8 owner-command-center/dist/SHA256SUMS.txt

      - name: Upload verified Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Obserra-Owner-AI-Command-Center-${{ github.sha }}
          path: |
            owner-command-center/dist/*.exe
            owner-command-center/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  verify-real-paid-access:
    if: github.event_name == 'workflow_dispatch' && inputs.course_id != '' && inputs.checkout_session_id != ''
    runs-on: ubuntu-latest
    environment: academy-live-verification
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Stripe payment, Clerk entitlement, and Academy commerce readback
        working-directory: owner-command-center
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          ACADEMY_TEST_COURSE_ID: ${{ inputs.course_id }}
          ACADEMY_TEST_CHECKOUT_SESSION_ID: ${{ inputs.checkout_session_id }}
          OBSERRA_ACADEMY_URL: ${{ inputs.academy_url }}
        run: npm run verify:live-purchase
