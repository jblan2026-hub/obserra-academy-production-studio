name: Continuous Academy Course AI Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches:
      - main
      - agent/continue-course-buildout
    paths:
      - "courses/**/course-manifest.json"
      - "studio/apply-course-policy.mjs"
      - "studio/audit-course-build-readiness.mjs"
      - "studio/author-course-ai.mjs"
      - "studio/author-courses-parallel.mjs"
      - "studio/bootstrap-protected-database.mjs"
      - "studio/build-all-courses.mjs"
      - "studio/generate-catalog.mjs"
      - "studio/validate-learner-catalog.mjs"
      - "package.json"
      - "prisma/schema.prisma"
      - ".github/workflows/continuous-course-ai-audit.yml"
      - ".gitignore"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: continuous-academy-course-ai-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit-author-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ACADEMY_AUTHORING_PROVIDER: openai
      ACADEMY_AUTHORING_CONCURRENCY: 6
      ACADEMY_AUTHORING_MAX_ATTEMPTS: 3
      ACADEMY_AUTHORING_RETRY_BASE_MS: 5000
      ACADEMY_EXPECTED_REVIEW_COURSES: 60
      ACADEMY_DATABASE_BOOTSTRAP_ALLOWED: ${{ github.ref == 'refs/heads/agent/continue-course-buildout' && 'true' || 'false' }}
      STUDIO_OWNER_ORGANIZATION_ID: org_obserra_academy
      STUDIO_OWNER_ORGANIZATION_NAME: Obserra Academy
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: ${{ secrets.ACADEMY_DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Studio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Normalize governed course policy before audit
        run: npm run apply:course-policy

      - name: Audit every course from its own manifest
        id: audit
        continue-on-error: true
        run: npm run audit:courses

      - name: Stop unsafe automatic repair for invalid manifests
        if: steps.audit.outputs.blocking_findings != '0'
        shell: bash
        run: |
          TITLE="Academy course manifest alignment failure"
          BODY="The continuous Academy audit found ${{ steps.audit.outputs.blocking_findings }} blocking manifest alignment finding(s). Automatic authoring and build were stopped. Review catalog/continuous-course-audit.json from workflow run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          ISSUE_NUMBER="$(gh issue list --state open --search \"$TITLE in:title\" --json number --jq '.[0].number // empty')"
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
          exit 1

      - name: Close resolved manifest blocker issue
        if: steps.audit.outputs.blocking_findings == '0'
        shell: bash
        run: |
          TITLE="Academy course manifest alignment failure"
          ISSUE_NUMBER="$(gh issue list --state open --search \"$TITLE in:title\" --json number --jq '.[0].number // empty')"
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue close "$ISSUE_NUMBER" --comment "Resolved by workflow run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          fi

      - name: Require protected authoring and LCMS credentials
        if: steps.audit.outputs.authoring_required == 'true'
        shell: bash
        run: |
          MISSING=""
          test -n "$OPENAI_API_KEY" || MISSING="OPENAI_API_KEY"
          test -n "$DATABASE_URL" || MISSING="${MISSING:+$MISSING, }ACADEMY_DATABASE_URL"
          TITLE="Academy protected learner build credentials required"
          if [ -n "$MISSING" ]; then
            BODY="The 60-course owner-review learner build requires protected credentials that are not configured: $MISSING. Protected learner content will not be generated or written to the public repository. Latest workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
            ISSUE_NUMBER="$(gh issue list --state open --search \"$TITLE in:title\" --json number --jq '.[0].number // empty')"
            if [ -n "$ISSUE_NUMBER" ]; then
              gh issue edit "$ISSUE_NUMBER" --body "$BODY"
            else
              gh issue create --title "$TITLE" --body "$BODY"
            fi
            exit 1
          fi

          ISSUE_NUMBERS="$(gh issue list --state open --search \"$TITLE in:title\" --json number --jq '.[].number')"
          if [ -n "$ISSUE_NUMBERS" ]; then
            while read -r ISSUE_NUMBER; do
              [ -n "$ISSUE_NUMBER" ] || continue
              gh issue close "$ISSUE_NUMBER" --comment "Protected Academy credentials are configured. Resolved by workflow run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
            done <<< "$ISSUE_NUMBERS"
          fi

      - name: Bootstrap protected Academy PostgreSQL schema
        if: steps.audit.outputs.authoring_required == 'true' && github.ref == 'refs/heads/agent/continue-course-buildout'
        run: npm run db:bootstrap:protected

      - name: Validate protected database schema
        if: steps.audit.outputs.authoring_required == 'true'
        run: npm run db:validate

      - name: AI author owner-review courses with controlled parallel workers
        if: steps.audit.outputs.authoring_required == 'true'
        run: npm run author:parallel

      - name: Re-audit authored packages before downstream build
        if: steps.audit.outputs.authoring_required == 'true'
        run: |
          npm run audit:courses
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('catalog/continuous-course-audit.json', 'utf8'));
          const unresolved = report.courses.filter((course) =>
            course.ownerReviewEligible && (
              course.authoringMissing ||
              course.findings.includes('stale-ai-course-package') ||
              course.findings.includes('untraceable-ai-course-package')
            )
          );
          if (unresolved.length > 0) {
            console.error(`[Academy Studio] ${unresolved.length} owner-review course package(s) remain unresolved after parallel authoring: ${unresolved.map((course) => course.courseId).join(', ')}`);
            process.exit(2);
          }
          NODE

      - name: Regenerate governed course assets and catalogs
        run: |
          npm run build:all
          npm run catalog

      - name: Validate protected learner catalog completeness
        run: npm run validate:learner-catalog

      - name: Validate manifest-defined courses and protected LCMS load plan
        run: |
          npm run audit:courses
          npm run validate
          npm run load:courses:check
          npm test

      - name: Load protected learner content into LCMS
        if: steps.audit.outputs.authoring_required == 'true'
        run: npm run load:courses

      - name: Verify protected learner content remains untracked
        run: |
          if git ls-files --error-unmatch catalog/academy-learner-course-catalog.json >/dev/null 2>&1; then
            echo "Protected learner catalog must not be tracked in the public repository."
            exit 1
          fi
          if git ls-files 'courses/*/generated/*' | grep -q .; then
            echo "Protected generated learner packages must not be tracked in the public repository."
            exit 1
          fi

      - name: Detect safe public generated changes
        id: changes
        run: |
          git add -A courses catalog .gitignore
          git reset -- catalog/academy-learner-course-catalog.json catalog/learner-catalog-readiness.json catalog/parallel-authoring-summary.json 2>/dev/null || true
          git reset -- 'courses/*/generated/*' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit safe public course metadata to controlled branch
        if: steps.changes.outputs.changed == 'true' && github.ref == 'refs/heads/agent/continue-course-buildout'
        run: |
          git config user.name "Obserra Academy AI Builder"
          git config user.email "academy-ai-builder@users.noreply.github.com"
          git commit -m "Regenerate governed Academy course metadata"
          git push origin HEAD:agent/continue-course-buildout

      - name: Create governed public metadata branch
        if: steps.changes.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        id: branch
        run: |
          BRANCH="automation/academy-course-build-${GITHUB_RUN_ID}"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          git config user.name "Obserra Academy AI Builder"
          git config user.email "academy-ai-builder@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "Regenerate governed Academy course metadata"
          git push origin "$BRANCH"

      - name: Open draft owner review pull request for safe public metadata
        if: steps.changes.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        run: |
          gh pr create \
            --draft \
            --base main \
            --head "${{ steps.branch.outputs.name }}" \
            --title "Academy governed course metadata alignment" \
            --body "Automated governed build validated the full 60-course owner-review learner catalog in a protected ephemeral workspace and loaded protected learner content to the configured LCMS. This PR contains only safe public manifests, metadata, and evidence. Production publication remains separately approval-controlled. Workflow evidence: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."

      - name: Publish non-sensitive audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: continuous-academy-course-audit-${{ github.run_id }}
          path: |
            catalog/continuous-course-audit.json
            catalog/bulk-build-report.json
            catalog/academy-course-catalog.json
          retention-days: 180
