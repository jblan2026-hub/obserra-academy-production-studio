name: Accelerated Protected Course Build
run-name: Academy accelerated build • ${{ github.ref_name }} • ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - agent/academy-build-acceleration
      - agent/academy-resumable-quality-repair
    paths:
      - "courses/**"
      - "studio/**"
      - "prisma/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/accelerated-protected-course-build.yml"
  pull_request:
    branches:
      - agent/academy-build-acceleration
      - agent/academy-production-integration
      - main
    paths:
      - "courses/**"
      - "studio/**"
      - "prisma/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/accelerated-protected-course-build.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: accelerated-protected-course-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_PROGRESS: "false"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
  ACADEMY_AUTHORING_PROVIDER: openai
  ACADEMY_AUTHORING_CONCURRENCY: 12
  ACADEMY_AUTHORING_MAX_ATTEMPTS: 3
  ACADEMY_AUTHORING_RETRY_BASE_MS: 5000
  ACADEMY_AUTHORING_NARRATIVE_TARGET_WORDS: 1500
  ACADEMY_AUTHORING_REPAIR_ATTEMPTS: 2
  ACADEMY_AUTHORING_REPAIR_CONCURRENCY: 6
  ACADEMY_AUTHORING_REPAIR_NARRATIVE_TARGET_WORDS: 1650
  ACADEMY_AUTHORING_REPAIR_TIMEOUT_MS: 1500000
  ACADEMY_PREFLIGHT_MAX_ATTEMPTS: 3
  ACADEMY_PREFLIGHT_RETRY_BASE_MS: 2000
  ACADEMY_PREFLIGHT_TIMEOUT_MS: 60000
  ACADEMY_EXPECTED_REVIEW_COURSES: 61
  OPENAI_MAX_OUTPUT_TOKENS: 64000
  OPENAI_PMP_MAX_OUTPUT_TOKENS: 100000
  OPENAI_REASONING_EFFORT: medium
  OPENAI_REPAIR_REASONING_EFFORT: low
  OBSERRA_PORTFOLIO_WORKER_COUNT: 36
  OBSERRA_APPLICATION_WORKER_COUNT: 20
  ACADEMY_COURSE_WORKER_COUNT: 16
  STUDIO_OWNER_ORGANIZATION_ID: org_obserra_academy
  STUDIO_OWNER_ORGANIZATION_NAME: Obserra Academy

jobs:
  authoring:
    name: Audit, author with 16 allocated workers, and repair protected courses
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      authoring_required: ${{ steps.audit.outputs.authoring_required }}
      blocking_findings: ${{ steps.audit.outputs.blocking_findings }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_ORGANIZATION: ${{ secrets.OPENAI_ORGANIZATION }}
      OPENAI_PROJECT: ${{ secrets.OPENAI_PROJECT }}
    steps:
      - name: Checkout Academy Studio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-academy-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-academy-

      - name: Install Studio dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --prefer-offline

      - name: Normalize authoring credential only
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const output = process.env.GITHUB_ENV;
          for (const name of ['OPENAI_API_KEY', 'OPENAI_ORGANIZATION', 'OPENAI_PROJECT']) {
            const raw = String(process.env[name] ?? '').trim();
            const quoted = (raw.startsWith('"') && raw.endsWith('"')) || (raw.startsWith("'") && raw.endsWith("'"));
            const value = quoted ? raw.slice(1, -1).trim() : raw;
            if (value && /\r|\n/.test(value)) throw new Error(`${name} contains an unexpected newline.`);
            if (value) fs.appendFileSync(output, `${name}=${value}\n`);
          }
          console.log(`[Academy Studio] Authoring credentials normalized. apiKey=${Boolean(String(process.env.OPENAI_API_KEY ?? '').trim())} organization=${Boolean(String(process.env.OPENAI_ORGANIZATION ?? '').trim())} project=${Boolean(String(process.env.OPENAI_PROJECT ?? '').trim())}`);
          NODE

      - name: Normalize governed course policy
        run: npm run apply:course-policy

      - name: Audit every course before provider use
        id: audit
        run: npm run audit:courses

      - name: Stop invalid manifests before authoring
        if: steps.audit.outputs.blocking_findings != '0'
        run: |
          echo "Blocking manifest findings: ${{ steps.audit.outputs.blocking_findings }}"
          exit 1

      - name: Require protected authoring credential
        if: steps.audit.outputs.authoring_required == 'true'
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is required for protected authoring."
            exit 1
          fi

      - name: Retry transient provider and model preflight failures
        if: steps.audit.outputs.authoring_required == 'true'
        run: node studio/preflight-accelerated-authoring.mjs

      - name: Author owner-review courses with bounded provider concurrency
        id: initial_authoring
        if: steps.audit.outputs.authoring_required == 'true'
        continue-on-error: true
        run: npm run author:parallel

      - name: Validate and selectively repair every incomplete package
        if: always() && !cancelled() && steps.audit.outputs.blocking_findings == '0'
        run: node studio/validate-and-repair-authored-packages.mjs

      - name: Re-audit protected packages
        run: npm run audit:courses

      - name: Build course assets and catalogs
        run: |
          npm run build:all
          npm run catalog
          npm run validate:learner-catalog

      - name: Generate Prisma client after authoring
        run: npm run db:generate

      - name: Validate protected LCMS load plan and tests
        run: |
          npm run validate
          npm run load:courses:check
          npm test

      - name: Verify protected content is not tracked
        shell: bash
        run: |
          if git ls-files --error-unmatch catalog/academy-learner-course-catalog.json >/dev/null 2>&1; then
            echo "Protected learner catalog must not be tracked."
            exit 1
          fi
          if git ls-files 'courses/*/generated/*' | grep -q .; then
            echo "Protected generated learner packages must not be tracked."
            exit 1
          fi

      - name: Upload protected course packages for review and LCMS loading
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: protected-academy-course-packages-${{ github.run_id }}
          path: |
            courses/*/generated/**
            catalog/academy-learner-course-catalog.json
            catalog/learner-catalog-readiness.json
            catalog/parallel-authoring-summary.json
            catalog/authoring-quality-repair.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      - name: Upload non-sensitive audit evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: accelerated-academy-audit-${{ github.run_id }}
          path: |
            catalog/accelerated-provider-preflight.json
            catalog/continuous-course-audit.json
            catalog/bulk-build-report.json
            catalog/academy-course-catalog.json
            catalog/learner-catalog-readiness.json
            catalog/authoring-quality-repair.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

      - name: Record authoring completion summary
        if: always()
        run: |
          {
            echo "## Accelerated Academy authoring"
            echo "- Governed course inventory: 61"
            echo "- Fixed portfolio allocation: 36 total"
            echo "- Application reservation: 20"
            echo "- Course worker allocation: 16"
            echo "- Simultaneous provider authoring limit: 12"
            echo "- Selective repair provider limit: 6"
            echo "- Authoring required: ${{ steps.audit.outputs.authoring_required }}"
            echo "- Blocking findings: ${{ steps.audit.outputs.blocking_findings }}"
            echo "- Initial authoring outcome: ${{ steps.initial_authoring.outcome }}"
            echo "- Initial partial failures continue into bounded selective repair"
            echo "- Partial packages are retained for diagnostics and recovery"
            echo "- Database credentials were intentionally excluded from this job"
          } >> "$GITHUB_STEP_SUMMARY"

  lcms-load:
    name: Authenticate protected PostgreSQL and load LCMS
    needs: authoring
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.ACADEMY_DATABASE_URL }}
      ACADEMY_SUPABASE_PROJECT_REF: nwxnyqlyzyufgoadtqxs
      ACADEMY_SUPABASE_REGION: us-east-1
    steps:
      - name: Checkout Academy Studio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-academy-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-academy-

      - name: Install Studio dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --prefer-offline

      - name: Download protected course packages
        uses: actions/download-artifact@v4
        with:
          name: protected-academy-course-packages-${{ github.run_id }}
          path: .

      - name: Normalize protected database credential
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const output = process.env.GITHUB_ENV;

          function trimOuterQuotes(value) {
            const quoted = (value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"));
            return quoted ? value.slice(1, -1).trim() : value;
          }

          let value = trimOuterQuotes(String(process.env.DATABASE_URL ?? '').trim());
          const assignment = value.match(/^(?:ACADEMY_DATABASE_URL|DATABASE_URL)\s*=\s*(.+)$/is);
          if (assignment) value = trimOuterQuotes(assignment[1].trim());
          if (!value) throw new Error('ACADEMY_DATABASE_URL is required for LCMS loading.');
          if (/\r|\n/.test(value)) throw new Error('ACADEMY_DATABASE_URL contains an unexpected newline.');

          if (!/^postgres(?:ql)?:\/\//i.test(value)) {
            const projectRef = process.env.ACADEMY_SUPABASE_PROJECT_REF;
            const region = process.env.ACADEMY_SUPABASE_REGION;
            const username = `postgres.${projectRef}`;
            const host = `aws-0-${region}.pooler.supabase.com`;
            value = `postgresql://${encodeURIComponent(username)}:${encodeURIComponent(value)}@${host}:5432/postgres?schema=public&sslmode=require&connect_timeout=30`;
          }

          const parsed = new URL(value);
          if (!['postgres:', 'postgresql:'].includes(parsed.protocol)) throw new Error('Invalid database protocol.');
          fs.appendFileSync(output, `DATABASE_URL=${parsed.toString()}\n`);
          console.log(`[Academy Studio] Protected database URL normalized for host ${parsed.hostname}.`);
          NODE

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Bootstrap protected Academy schema
        run: npm run db:bootstrap:protected

      - name: Validate protected database schema
        run: npm run db:validate

      - name: Load protected learner content into LCMS
        run: npm run load:courses

      - name: Record LCMS completion summary
        run: |
          {
            echo "## Protected LCMS load"
            echo "- Protected package artifact: downloaded"
            echo "- PostgreSQL bootstrap: passed"
            echo "- Prisma validation: passed"
            echo "- Course load: passed"
          } >> "$GITHUB_STEP_SUMMARY"
