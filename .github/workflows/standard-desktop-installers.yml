name: Standard Desktop Installers

on:
  workflow_dispatch:
  push:
    branches:
      - agent/standard-device-installer
    paths:
      - "owner-command-center/**"
      - ".github/workflows/standard-desktop-installers.yml"
  pull_request:
    branches:
      - main
      - agent/academy-production-integration
    paths:
      - "owner-command-center/**"
      - ".github/workflows/standard-desktop-installers.yml"

permissions:
  contents: read

concurrency:
  group: standard-desktop-installers-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_PROGRESS: "false"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"

jobs:
  contract-gate:
    name: Installer and endpoint contract gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: owner-command-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore npm and Electron caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-${{ runner.arch }}-command-center-${{ hashFiles('owner-command-center/package.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-command-center-
      - name: Install Command Center dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false --prefer-offline
      - name: Verify standard installer and endpoint contracts
        run: npm run verify
      - name: Verify distributable bootstrap and enrollment UI syntax
        run: |
          node --check src/endpoint-enrollment-ui.js
          node --check electron/bootstrap-main.cjs
          node --check electron/main.cjs
          node --check electron/main-with-remediation.cjs
          node --check electron/endpoint-enrollment.cjs
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('resources/Obserra-Command-Center-Bootstrap.json','utf8')); if(p.targetHostname!=='*'||p.autoEnroll!==false||p.requireEnrollment!==true) throw new Error('generic enrollment profile invalid'); console.log('Generic owner-enrolled bootstrap verified.')"

  windows:
    name: Windows ${{ matrix.arch }} setup and portable packages
    needs: contract-gate
    runs-on: windows-2025
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arch:
          - x64
          - arm64
    defaults:
      run:
        working-directory: owner-command-center
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore npm and Electron caches
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/npm-cache
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-${{ matrix.arch }}-command-center-${{ hashFiles('owner-command-center/package.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-command-center-
      - name: Install Command Center dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false --prefer-offline
      - name: Verify Windows packaging contract
        run: |
          node scripts/verify-installer-config.mjs
          node --check electron/bootstrap-main.cjs
      - name: Build Windows standard setup and portable package
        shell: pwsh
        run: npx electron-builder --win nsis portable --${{ matrix.arch }} --publish never --config.compression=${{ github.event_name == 'workflow_dispatch' && 'maximum' || 'normal' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      - name: Verify Windows package inventory and create SHA-256 manifest
        shell: pwsh
        run: |
          $arch = "${{ matrix.arch }}"
          $required = @(
            "dist/Obserra-Owner-AI-Command-Center-Setup-0.4.0-$arch.exe",
            "dist/Obserra-Owner-AI-Command-Center-Portable-0.4.0-$arch.exe"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing Windows package: $file" }
            if ((Get-Item $file).Length -lt 1000000) { throw "Windows package is unexpectedly small: $file" }
          }
          $required | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_).Hash, (Split-Path $_ -Leaf)
          } | Set-Content "dist/SHA256SUMS-Windows-$arch.txt" -Encoding ascii
      - name: Upload Windows standard installers
        uses: actions/upload-artifact@v4
        with:
          name: Obserra-Command-Center-Standard-Windows-${{ matrix.arch }}-${{ github.sha }}
          path: |
            owner-command-center/dist/Obserra-Owner-AI-Command-Center-Setup-0.4.0-${{ matrix.arch }}.exe
            owner-command-center/dist/Obserra-Owner-AI-Command-Center-Portable-0.4.0-${{ matrix.arch }}.exe
            owner-command-center/dist/SHA256SUMS-Windows-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 180

  macos:
    name: macOS universal DMG and ZIP
    needs: contract-gate
    runs-on: macos-14
    timeout-minutes: 90
    defaults:
      run:
        working-directory: owner-command-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore npm and Electron caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-${{ runner.arch }}-command-center-${{ hashFiles('owner-command-center/package.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-command-center-
      - name: Install Command Center dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false --prefer-offline
      - name: Build macOS universal packages
        run: npx electron-builder --mac dmg zip --universal --publish never --config.compression=${{ github.event_name == 'workflow_dispatch' && 'maximum' || 'normal' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Verify macOS package inventory
        run: |
          test -f dist/Obserra-Owner-AI-Command-Center-0.4.0-universal.dmg
          test -f dist/Obserra-Owner-AI-Command-Center-0.4.0-universal.zip
          shasum -a 256 dist/Obserra-Owner-AI-Command-Center-0.4.0-universal.dmg dist/Obserra-Owner-AI-Command-Center-0.4.0-universal.zip > dist/SHA256SUMS-macOS.txt
      - name: Upload macOS standard installers
        uses: actions/upload-artifact@v4
        with:
          name: Obserra-Command-Center-Standard-macOS-${{ github.sha }}
          path: |
            owner-command-center/dist/Obserra-Owner-AI-Command-Center-0.4.0-universal.dmg
            owner-command-center/dist/Obserra-Owner-AI-Command-Center-0.4.0-universal.zip
            owner-command-center/dist/SHA256SUMS-macOS.txt
          if-no-files-found: error
          retention-days: 180

  linux:
    name: Linux ${{ matrix.arch }} AppImage and DEB
    needs: contract-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arch:
          - x64
          - arm64
    defaults:
      run:
        working-directory: owner-command-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore npm and Electron caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-${{ matrix.arch }}-command-center-${{ hashFiles('owner-command-center/package.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-command-center-
      - name: Install Linux packaging prerequisites
        working-directory: .
        run: sudo apt-get update -qq && sudo apt-get install --no-install-recommends -y -qq libopenjp2-tools
      - name: Install Command Center dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false --prefer-offline
      - name: Build Linux packages
        run: npx electron-builder --linux AppImage deb --${{ matrix.arch }} --publish never --config.compression=${{ github.event_name == 'workflow_dispatch' && 'maximum' || 'normal' }}
      - name: Verify Linux package inventory
        run: |
          mapfile -t appimages < <(find dist -maxdepth 1 -type f -name 'Obserra-Owner-AI-Command-Center-0.4.0-*.AppImage' -print | sort)
          mapfile -t debs < <(find dist -maxdepth 1 -type f -name 'Obserra-Owner-AI-Command-Center-0.4.0-*.deb' -print | sort)
          test "${#appimages[@]}" -eq 1
          test "${#debs[@]}" -eq 1
          test "$(stat -c '%s' "${appimages[0]}")" -gt 1000000
          test "$(stat -c '%s' "${debs[0]}")" -gt 1000000
          sha256sum "${appimages[0]}" "${debs[0]}" > dist/SHA256SUMS-Linux-${{ matrix.arch }}.txt
      - name: Upload Linux standard installers
        uses: actions/upload-artifact@v4
        with:
          name: Obserra-Command-Center-Standard-Linux-${{ matrix.arch }}-${{ github.sha }}
          path: |
            owner-command-center/dist/Obserra-Owner-AI-Command-Center-0.4.0-*.AppImage
            owner-command-center/dist/Obserra-Owner-AI-Command-Center-0.4.0-*.deb
            owner-command-center/dist/SHA256SUMS-Linux-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 180
