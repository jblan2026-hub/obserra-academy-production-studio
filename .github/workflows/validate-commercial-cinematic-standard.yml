name: Validate Commercial Cinematic Course Production Standard

# Temporary branch-only scheduling guard for PR 46. Restore the full workflow from main before merge.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commercial-cinematic-course-standard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deferred-outside-academy-pr46:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.number != 46 }}
    runs-on: ubuntu-latest
    steps:
      - name: Require restoration outside PR 46
        run: |
          echo "Temporary PR 46 scheduling guard is active. Restore .github/workflows/validate-commercial-cinematic-standard.yml from main before other use."
          exit 1
