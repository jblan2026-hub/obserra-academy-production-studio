name: Command Center Live Endpoint Gate
run-name: Command Center live endpoint • ${{ github.ref_name }} • ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - agent/command-center-live-endpoint
    paths:
      - "owner-command-center/**"
      - ".github/workflows/command-center-live-endpoint.yml"
  pull_request:
    branches:
      - main
      - agent/academy-production-integration
    paths:
      - "owner-command-center/**"
      - ".github/workflows/command-center-live-endpoint.yml"

permissions:
  contents: read

concurrency:
  group: command-center-live-endpoint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  endpoint-contract:
    name: Endpoint identity, evidence, and local-only contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: owner-command-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Command Center dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate changed JavaScript and CommonJS syntax
        run: |
          node --check electron/main-with-remediation.cjs
          node --check electron/endpoint-enrollment.cjs
          node --check electron/academy-production-evidence.cjs
          node --check electron/preload.cjs
          node --check src/academy-batch.js
          node --check scripts/verify-endpoint-enrollment.mjs
          node --check scripts/verify-academy-production-evidence.mjs
      - name: Run complete Command Center verification
        run: npm run verify
      - name: Verify endpoint and Academy evidence gates directly
        run: |
          npm run verify:endpoint
          npm run verify:academy-evidence
      - name: Verify no endpoint credentials are embedded
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=node_modules --exclude='*.md' '(sk_live_[A-Za-z0-9]{16,}|whsec_[A-Za-z0-9]{16,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' .; then
            echo "Embedded production credential material detected."
            exit 1
          fi
          grep -F 'localOnly: true' electron/endpoint-enrollment.cjs
          grep -F '127.0.0.1' electron/endpoint-enrollment.cjs
          grep -F 'publicationLocked' electron/academy-production-evidence.cjs
          grep -F 'configuredCourseWorkers !== 36' electron/academy-production-evidence.cjs
          grep -F 'configuredApplicationWorkers !== 0' electron/academy-production-evidence.cjs

  windows-release:
    name: Windows installer, portable executable, and endpoint verification media
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        working-directory: owner-command-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Command Center dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run Command Center verification on Windows
        run: npm run verify
      - name: Build target-bound release media
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ./scripts/build-removable-media-package.ps1 -TargetHostname obserra
      - name: Verify release-media contract
        shell: pwsh
        run: |
          $media = Join-Path $PWD "release-media"
          if (-not (Test-Path $media)) { throw "release-media directory missing" }
          $required = @(
            "SHA256SUMS.json",
            "SHA256SUMS.txt",
            "Obserra-Command-Center-Bootstrap.json",
            "Install-Obserra-Command-Center.ps1",
            "Test-Obserra-Command-Center-Endpoint.ps1",
            "ENDPOINT-OPERATIONS.md",
            "INSTALL-AND-RECOVERY.md",
            "HIGH-AVAILABILITY.md"
          )
          foreach ($name in $required) {
            if (-not (Test-Path (Join-Path $media $name))) { throw "required artifact missing: $name" }
          }
          $bootstrap = Get-Content (Join-Path $media "Obserra-Command-Center-Bootstrap.json") -Raw | ConvertFrom-Json
          if ($bootstrap.schemaVersion -ne "1.0") { throw "bootstrap schema mismatch" }
          if ($bootstrap.targetHostname -ne "obserra") { throw "target hostname mismatch" }
          if ($bootstrap.localOnly -ne $true) { throw "local-only boundary missing" }
          if ($bootstrap.requireEnrollment -ne $true) { throw "endpoint enrollment requirement missing" }
          if ($bootstrap.autoEnroll -ne $true) { throw "target-bound auto enrollment missing" }
          if ($bootstrap.autoStart -ne $true) { throw "auto-start requirement missing" }
          if ($bootstrap.expectedCourseWorkerTarget -ne 36) { throw "36-worker target missing" }
          if ($bootstrap.expectedApplicationWorkerAllocation -ne 0) { throw "zero application worker allocation missing" }
          if ($bootstrap.requiredWorkerMode -ne "interchangeable-course-production") { throw "worker mode mismatch" }
          if ($bootstrap.publicationAuthorityGranted -ne $false) { throw "bootstrap must not grant publication authority" }
          if (@($bootstrap.connectors).Count -ne 10) { throw "connector inventory mismatch" }

          $manifest = @(Get-Content (Join-Path $media "SHA256SUMS.json") -Raw | ConvertFrom-Json)
          if ($manifest.Count -lt 8) { throw "hash manifest incomplete" }
          foreach ($entry in $manifest) {
            $path = Join-Path $media $entry.File
            if (-not (Test-Path $path)) { throw "manifest file missing: $($entry.File)" }
            $actual = (Get-FileHash -Algorithm SHA256 -Path $path).Hash
            if ($actual -ne $entry.SHA256) { throw "hash mismatch for $($entry.File)" }
          }
          $installer = Get-ChildItem $media -Filter "Obserra-Owner-AI-Command-Center-*.exe" | Where-Object { $_.Name -notlike "*Portable*" }
          $portable = Get-ChildItem $media -Filter "Obserra-Owner-AI-Command-Center-Portable-*.exe"
          if (-not $installer -or -not $portable) { throw "Windows executable inventory incomplete" }
      - uses: actions/upload-artifact@v4
        with:
          name: Obserra-Command-Center-Live-Endpoint-${{ github.sha }}
          path: owner-command-center/release-media/**
          if-no-files-found: error
          retention-days: 180

  claim-boundary:
    name: Live endpoint claim boundary
    runs-on: ubuntu-latest
    needs:
      - endpoint-contract
      - windows-release
    steps:
      - run: |
          echo "Source contract: PASSED"
          echo "Windows package and verification media: PASSED"
          echo "Actual installation on the owner's endpoint: REQUIRES execution of the packaged installer on that endpoint"
          echo "Endpoint-ready status: must be proven by the generated heartbeat and loopback readiness receipt"
          echo "Academy control-plane operational status: remains evidence-driven and fail closed"
          echo "Course publication authority: NOT GRANTED"
